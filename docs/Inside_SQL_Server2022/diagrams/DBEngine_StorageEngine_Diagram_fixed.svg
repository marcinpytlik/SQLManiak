
<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="900" viewBox="0 0 1300 900">
  <style>
    .title { font: bold 20px sans-serif; fill: #0b3d91; }
    .bigbox { fill: #f4f7fb; stroke: #1f3b6f; stroke-width:2; rx:12; }
    .box { fill: #ffffff; stroke: #2b547e; stroke-width:1.2; rx:6; }
    .label { font: 13px sans-serif; fill: #12233b; }
    .small { font: 11px sans-serif; fill: #12233b; }
    .arrow { stroke: #0b66d1; stroke-width:2; marker-end: url(#a); fill: none; }
    .connector { stroke: #9bb9e8; stroke-width:1.5; marker-end: url(#a); fill: none; }
    .section-title { font: bold 16px sans-serif; fill: #07214a; }
    .legend-box { fill: #fff8e6; stroke: #d39d00; stroke-width:1.2; rx:6; }
  </style>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0b66d1" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="40" y="40" class="title">Database Engine &amp; Storage Engine — Components Diagram</text>
  <text x="40" y="65" class="small">Relational Engine (query processing) ↔ Storage Engine (storage, I/O, logging)</text>

  <!-- Relational Engine big box -->
  <rect x="40" y="90" width="580" height="680" class="bigbox" />
  <text x="60" y="120" class="section-title">Relational Engine</text>

  <!-- Parser -->
  <rect x="80" y="150" width="500" height="58" class="box" />
  <text x="100" y="187" class="label">Parser / Front-End</text>
  <text x="100" y="203" class="small">Syntax check, parse tree</text>

  <!-- Algebrizer / Binder -->
  <rect x="80" y="220" width="500" height="58" class="box" />
  <text x="100" y="257" class="label">Binder / Algebrizer</text>
  <text x="100" y="273" class="small">Name resolution, semantic binding</text>

  <!-- Optimizer -->
  <rect x="80" y="290" width="500" height="78" class="box" />
  <text x="100" y="325" class="label">Query Optimizer</text>
  <text x="100" y="343" class="small">Cost-based plan generation, statistics</text>

  <!-- Plan cache -->
  <rect x="80" y="380" width="240" height="68" class="box" />
  <text x="100" y="418" class="label">Plan Cache</text>
  <text x="100" y="434" class="small">Compiled plans, reuse</text>

  <!-- Parameter sniffing / recompilation -->
  <rect x="340" y="380" width="240" height="68" class="box" />
  <text x="360" y="418" class="label">Parameter Sniffing / Recompile</text>
  <text x="360" y="434" class="small">Hints, OPTION(RECOMPILE)</text>

  <!-- Execution Engine -->
  <rect x="80" y="470" width="500" height="110" class="box" />
  <text x="100" y="505" class="label">Execution Engine</text>
  <text x="100" y="523" class="small">Operator pipeline: Index Seek/Scan, Joins, Aggregates</text>
  <text x="100" y="541" class="small">Handles operators, parallelism, row source</text>

  <!-- Statistics / Query Store -->
  <rect x="80" y="590" width="240" height="60" class="box" />
  <text x="100" y="628" class="label">Statistics</text>
  <text x="100" y="644" class="small">Histograms, cardinality estimates</text>

  <rect x="340" y="590" width="240" height="60" class="box" />
  <text x="360" y="628" class="label">Query Store</text>
  <text x="360" y="644" class="small">Plan history, regressions</text>

  <!-- Storage Engine big box -->
  <rect x="700" y="90" width="560" height="680" class="bigbox" />
  <text x="720" y="120" class="section-title">Storage Engine</text>

  <!-- Buffer Pool -->
  <rect x="740" y="150" width="490" height="78" class="box" />
  <text x="760" y="185" class="label">Buffer Pool (Buffer Manager)</text>
  <text x="760" y="203" class="small">Page caching (8 KB pages), read/write buffering</text>

  <!-- Access Methods -->
  <rect x="740" y="240" width="230" height="120" class="box" />
  <text x="760" y="268" class="label">Access Methods</text>
  <text x="760" y="286" class="small">B-Tree rowstore (clustered/non), Index Seek/Scan</text>
  <text x="760" y="302" class="small">Columnstore segments, Hash (memory-optimized)</text>

  <!-- Transaction Log -->
  <rect x="1010" y="240" width="220" height="100" class="box" />
  <text x="1030" y="268" class="label">Transaction Log</text>
  <text x="1030" y="286" class="small">Append-only WAL, VLFs, durability</text>
  <text x="1030" y="302" class="small">Log truncation via log backups</text>

  <!-- Lock/Latch/Versioning -->
  <rect x="740" y="380" width="230" height="80" class="box" />
  <text x="760" y="417" class="label">Lock Manager / Latch Manager</text>
  <text x="760" y="435" class="small">Locks, deadlock detection, latches</text>

  <rect x="1010" y="380" width="220" height="80" class="box" />
  <text x="1030" y="417" class="label">Version Store (tempdb)</text>
  <text x="1030" y="435" class="small">Row-versioning for RCSI/Snapshot</text>

  <!-- File structures -->
  <rect x="740" y="480" width="230" height="88" class="box" />
  <text x="760" y="515" class="label">Storage Structures</text>
  <text x="760" y="533" class="small">Pages (8 KB), Extents (64 KB), IAM/PFS/GAM/SGAM</text>
  <text x="760" y="549" class="small">Filegroups, .mdf/.ndf/.ldf</text>

  <!-- Recovery / Checkpoint -->
  <rect x="1010" y="480" width="220" height="88" class="box" />
  <text x="1030" y="515" class="label">Recovery / Checkpoint</text>
  <text x="1030" y="533" class="small">Redo/Undo, checkpoints, crash recovery</text>

  <!-- tempdb -->
  <rect x="740" y="580" width="490" height="70" class="box" />
  <text x="760" y="620" class="label">tempdb</text>
  <text x="760" y="638" class="small">Global workspace: sorts, version store, temp tables</text>

  <!-- IO layer / Filesystem -->
  <rect x="740" y="660" width="490" height="70" class="box" />
  <text x="760" y="695" class="label">I/O / Filesystem</text>
  <text x="760" y="713" class="small">Physical I/O, storage subsystems, async writebehind</text>

  <!-- Arrows between Relational and Storage engine -->
  <path d="M580 525 L700 520" class="arrow" />
  <text x="600" y="540" class="small">Read/Write pages (I/O requests)</text>

  <path d="M580 420 L700 360" class="arrow" />
  <text x="460" y="365" class="small">Plan requests, index lookups</text>

  <path d="M480 400 L740 410" class="connector" />
  <text x="500" y="395" class="small">Request: page fetch / latches</text>

  <!-- Legend -->
  <rect x="40" y="780" width="600" height="80" class="legend-box" />
  <text x="60" y="805" class="label">Legend</text>
  <text x="60" y="825" class="small">Relational Engine: parsing/planning/execution</text>
  <text x="60" y="842" class="small">Storage Engine: buffer pool, I/O, logging, recovery</text>
</svg>
