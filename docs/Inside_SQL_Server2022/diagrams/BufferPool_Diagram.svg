<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700">
  <style>
    .title { font: bold 18px sans-serif; fill: #0b3d91; }
    .box { fill: #ffffff; stroke: #2b547e; stroke-width:1.4; rx:8; }
    .bigbox { fill:#f4f7fb; stroke:#1f3b6f; stroke-width:2; rx:12; }
    .label { font: 13px sans-serif; fill: #12233b; }
    .small { font: 11px sans-serif; fill: #12233b; }
    .muted { font: 11px sans-serif; fill: #5a6b7a; }
    .arrow { stroke: #0b66d1; stroke-width:2; marker-end: url(#a); fill: none; }
    .dashed { stroke-dasharray:4 4; stroke:#9bb9e8; stroke-width:1.5; marker-end: url(#a); fill:none; }
  </style>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0b66d1" />
    </marker>
  </defs>

  <text x="30" y="40" class="title">Buffer Pool — co siedzi w pamięci (schemat)</text>
  <text x="30" y="60" class="muted">Ilustracja pokazuje główne elementy buffer pool: strony, deskryptory, dirty/clean, lazy writer, checkpoint, read-ahead, I/O</text>

  <!-- Buffer Pool big box -->
  <rect x="30" y="90" width="680" height="520" class="bigbox" />
  <text x="50" y="118" class="label">Buffer Pool (Buffer Cache)</text>

  <!-- Subcomponents: Buffer Descriptors -->
  <rect x="60" y="140" width="240" height="160" class="box" />
  <text x="75" y="165" class="label">Buffer Descriptors</text>
  <text x="75" y="185" class="small">- Pointer do strony</text>
  <text x="75" y="202" class="small">- status: dirty/clean</text>
  <text x="75" y="219" class="small">- reference count, latch info</text>
  <text x="75" y="236" class="small">- DBID, FileID, PageID</text>

  <!-- Page frames -->
  <rect x="330" y="140" width="350" height="300" class="box" />
  <text x="350" y="165" class="label">Page Frames (ramki stron)</text>
  <text x="350" y="185" class="small">Każda ramka trzyma 8 KB strony</text>

  <!-- Sample pages inside frames -->
  <g>
    <rect x="350" y="200" width="60" height="40" fill="#fff" stroke="#c2d9f8" rx="4"/>
    <text x="360" y="225" class="small">Data Page</text>
    <rect x="420" y="200" width="60" height="40" fill="#fff" stroke="#c2d9f8" rx="4"/>
    <text x="430" y="225" class="small">Index Page</text>
    <rect x="490" y="200" width="60" height="40" fill="#fff" stroke="#c2d9f8" rx="4"/>
    <text x="500" y="225" class="small">IAM / PFS</text>
    <rect x="560" y="200" width="60" height="40" fill="#fff" stroke="#c2d9f8" rx="4"/>
    <text x="570" y="225" class="small">Lob/Text</text>

    <rect x="350" y="250" width="60" height="40" fill="#fff" stroke="#c2d9f8" rx="4"/>
    <text x="360" y="275" class="small">Dirty Page</text>
    <rect x="420" y="250" width="60" height="40" fill="#fff" stroke="#c2d9f8" rx="4"/>
    <text x="430" y="275" class="small">Clean Page</text>
    <rect x="490" y="250" width="60" height="40" fill="#fff" stroke="#c2d9f8" rx="4"/>
    <text x="500" y="275" class="small">Text/Image</text>
    <rect x="560" y="250" width="60" height="40" fill="#fff" stroke="#c2d9f8" rx="4"/>
    <text x="570" y="275" class="small">Columnstore</text>
  </g>

  <!-- Free list / LRU lists -->
  <rect x="60" y="320" width="240" height="120" class="box" />
  <text x="75" y="345" class="label">Free List / Replacement Lists</text>
  <text x="75" y="365" class="small">- free list (wolne ramki)</text>
  <text x="75" y="382" class="small">- LRU/MRU queues (ageing)</text>
  <text x="75" y="399" class="small">- PLE (Page Life Expectancy wpływa tutaj)</text>

  <!-- Buffer Pool Extension -->
  <rect x="330" y="460" width="350" height="80" class="box" />
  <text x="350" y="488" class="label">Buffer Pool Extension (opcjonalne)</text>
  <text x="350" y="506" class="small">SSD jako rozszerzenie cache (async)</text>

  <!-- Components outside buffer pool -->
  <rect x="730" y="90" width="220" height="520" class="bigbox" />
  <text x="750" y="118" class="label">Powiązane komponenty (I/O / background)</text>

  <rect x="750" y="150" width="180" height="60" class="box" />
  <text x="760" y="180" class="label">Lazy Writer</text>
  <text x="760" y="197" class="small">- oczyszcza dirty pages</text>

  <rect x="750" y="230" width="180" height="60" class="box" />
  <text x="760" y="260" class="label">Checkpoint</text>
  <text x="760" y="277" class="small">- wymusza flush dirty pages do dysku</text>

  <rect x="750" y="310" width="180" height="60" class="box" />
  <text x="760" y="340" class="label">Read-Ahead</text>
  <text x="760" y="357" class="small">- prefetch stron dla sekwencyjnych operacji</text>

  <rect x="750" y="390" width="180" height="60" class="box" />
  <text x="760" y="420" class="label">IO Subsystem</text>
  <text x="760" y="437" class="small">- fizyczne .mdf/.ndf/.ldf I/O</text>

  <rect x="750" y="470" width="180" height="60" class="box" />
  <text x="760" y="500" class="label">Storage Engine</text>
  <text x="760" y="517" class="small">- flush, alloc, metadata</text>

  <!-- Arrows -->
  <line x1="380" y1="440" x2="750" y2="200" class="arrow" />
  <text x="430" y="420" class="small">Write dirty pages (flush)</text>

  <line x1="540" y1="520" x2="750" y2="330" class="arrow" />
  <text x="560" y="500" class="small">Read-Ahead requests</text>

  <line x1="300" y1="300" x2="750" y2="360" class="dashed" />
  <text x="320" y="285" class="small">Buffer descriptor lookup / latches</text>

  <!-- Legend -->
  <rect x="30" y="630" width="940" height="50" class="box" rx="6" />
  <text x="50" y="655" class="small">Legenda: Dirty Page = zmodyfikowana w pamięci (wymaga flush do log+disk), Clean Page = zgodna z dyskiem, Buffer Descriptor = meta o stronie, Free List = dostępne ramki</text>

  <text x="30" y="690" class="muted">ostatnia aktualizacja: 2025-09-16</text>
</svg>
