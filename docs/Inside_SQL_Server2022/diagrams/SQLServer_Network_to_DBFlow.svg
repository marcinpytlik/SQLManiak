<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520">
  <style>
    .box { fill: #f8f9fa; stroke: #343a40; stroke-width:1.5px; }
    .title { font: bold 14px sans-serif; fill: #212529; }
    .text { font: 12px sans-serif; fill: #212529; }
    .arrow { stroke: #0d6efd; stroke-width:2; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0d6efd" />
    </marker>
  </defs>

  <!-- Client -->
  <rect x="30" y="30" width="200" height="80" class="box" rx="6" ry="6"/>
  <text x="40" y="55" class="title">Client App</text>
  <text x="40" y="75" class="text">Driver: ADO.NET / ODBC / JDBC</text>

  <!-- Network -->
  <rect x="270" y="30" width="220" height="80" class="box" rx="6" ry="6"/>
  <text x="280" y="55" class="title">Network / Firewall / LB</text>
  <text x="280" y="75" class="text">TCP/TDS (+ TLS), ports 1433 / UDP 1434</text>

  <!-- Listener / Browser -->
  <rect x="520" y="30" width="300" height="80" class="box" rx="6" ry="6"/>
  <text x="530" y="55" class="title">SQL Listener / Browser</text>
  <text x="530" y="75" class="text">Listener (TCP) + Browser (UDP 1434)</text>

  <!-- Engine boxes -->
  <rect x="150" y="160" width="220" height="100" class="box" rx="6" ry="6"/>
  <text x="165" y="185" class="title">Relational Engine</text>
  <text x="165" y="205" class="text">Parser -> Optimizer -> Plan Cache -> Execute</text>

  <rect x="430" y="160" width="220" height="100" class="box" rx="6" ry="6"/>
  <text x="445" y="185" class="title">Storage Engine</text>
  <text x="445" y="205" class="text">Buffer Pool -> I/O -> Transaction Log</text>

  <!-- Results -->
  <rect x="310" y="300" width="280" height="80" class="box" rx="6" ry="6"/>
  <text x="325" y="330" class="title">Results (TDS)</text>
  <text x="325" y="350" class="text">Strumieniowane do klienta</text>

  <!-- Arrows -->
  <line x1="230" y1="70" x2="270" y2="70" class="arrow" />
  <line x1="490" y1="70" x2="520" y2="70" class="arrow" />
  <line x1="650" y1="110" x2="650" y2="160" class="arrow" />
  <line x1="430" y1="110" x2="430" y2="160" class="arrow" />
  <line x1="370" y1="260" x2="370" y2="300" class="arrow" />

  <!-- Connecting arrows from Listener to Engines -->
  <line x1="560" y1="110" x2="370" y2="160" class="arrow" />
  <line x1="560" y1="110" x2="480" y2="160" class="arrow" />

</svg>
