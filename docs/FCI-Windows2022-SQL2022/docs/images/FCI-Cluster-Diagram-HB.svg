<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="1600" height="1100" viewBox="0 0 1600 1100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font:700 26px 'Segoe UI', Arial; fill:#111827; }
      .sub   { font:600 16px 'Segoe UI', Arial; fill:#374151; }
      .txt   { font:14px 'Segoe UI', Arial; fill:#334155; }
      .tiny  { font:12px 'Segoe UI', Arial; fill:#475569; }
      .node  { fill:#f8fafc; stroke:#94a3b8; stroke-width:2; rx:16; ry:16; }
      .hb    { fill:#ecfeff; stroke:#67e8f9; stroke-width:2; rx:16; ry:16; }
      .cloud { fill:#eef2ff; stroke:#c7d2fe; stroke-width:2; rx:16; ry:16; }
      .stor  { fill:#fff7ed; stroke:#f59e0b; stroke-width:2; rx:16; ry:16; }
      .line  { stroke:#94a3b8; stroke-width:2; fill:none; }
      .hbline{ stroke:#06b6d4; stroke-width:2; fill:none; stroke-dasharray:6 4; }
    </style>
  </defs>

  <text class="title" x="32" y="42">SQL Server 2022 — FCI (wariant z osobną siecią Heartbeat)</text>

  <!-- LAN info -->
  <rect class="cloud" x="40" y="70" width="1520" height="120"/>
  <text class="sub" x="58" y="100">LAN / Subnet: 192.168.11.0/24</text>
  <text class="tiny" x="58" y="124">VNN: SQLSRV-FCI • VIP: 192.168.11.60 • DNS: DC (192.168.11.1)</text>

  <!-- NODEs with dual NICs -->
  <rect class="node" x="40" y="220" width="740" height="360"/>
  <text class="sub" x="58" y="252">NODE1</text>
  <text class="tiny" x="58" y="274">NIC1 (LAN): 192.168.11.2</text>
  <text class="tiny" x="58" y="296">NIC2 (HB): 172.16.200.2</text>
  <text class="tiny" x="58" y="320">tempdb: T:\MSSQL</text>

  <rect class="node" x="820" y="220" width="740" height="360"/>
  <text class="sub" x="838" y="252">NODE2</text>
  <text class="tiny" x="838" y="274">NIC1 (LAN): 192.168.11.3</text>
  <text class="tiny" x="838" y="296">NIC2 (HB): 172.16.200.3</text>
  <text class="tiny" x="838" y="320">tempdb: T:\MSSQL</text>

  <!-- Heartbeat banner -->
  <rect class="hb" x="40" y="600" width="1520" height="120"/>
  <text class="sub" x="58" y="630">Heartbeat / Cluster-only</text>
  <text class="tiny" x="58" y="654">Podsieć: 172.16.200.0/24 • Brak routingu • Metric wyższy niż LAN</text>

  <!-- STORAGE -->
  <rect class="stor" x="40" y="740" width="1520" height="260"/>
  <text class="sub" x="58" y="772">STORAGE — iSCSI Target (192.168.11.4)</text>
  <text class="tiny" x="58" y="796">LUN1: SQLData-iscsi.vhdx → E:\ • LUN2: SQLLogs-iscsi.vhdx → F:\</text>

  <!-- Lines -->
  <line class="line" x1="410" y1="580" x2="410" y2="520"/>
  <line class="line" x1="1190" y1="580" x2="1190" y2="520"/>
  <line class="hbline" x1="410" y1="600" x2="1190" y2="600"/>

</svg>
