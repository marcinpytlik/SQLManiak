  <text class="tiny" x="58" y="144">IP: 192.168.11.1</text>
  <text class="tiny" x="58" y="166">FSW: \\DC\Quorum$</text>
  <text class="tiny" x="58" y="188">SPN/CNO dla VNN</text>

