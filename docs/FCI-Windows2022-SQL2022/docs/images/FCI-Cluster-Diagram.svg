<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="1600" height="1000" viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font:700 26px 'Segoe UI', Arial; fill:#111827; }
      .sub   { font:600 16px 'Segoe UI', Arial; fill:#374151; }
      .txt   { font:14px 'Segoe UI', Arial; fill:#334155; }
      .tiny  { font:12px 'Segoe UI', Arial; fill:#475569; }
      .panel { fill:#ffffff; stroke:#cbd5e1; stroke-width:2; rx:16; ry:16; }
      .node  { fill:#f8fafc; stroke:#94a3b8; stroke-width:2; rx:16; ry:16; }
      .dc    { fill:#eef2ff; stroke:#93c5fd; stroke-width:2; rx:16; ry:16; }
      .stor  { fill:#fff7ed; stroke:#f59e0b; stroke-width:2; rx:16; ry:16; }
      .cluster { fill:#e9efff; stroke:#7c9bff; stroke-width:2; rx:14; ry:14; }
      .badge { fill:#ecfeff; stroke:#67e8f9; stroke-width:2; rx:10; ry:10; }
      .line  { stroke:#94a3b8; stroke-width:2; fill:none; }
    </style>
  </defs>

  <text class="title" x="32" y="42">SQL Server 2022 — Failover Cluster Instance (FCI)</text>
  <text class="txt" x="32" y="66">Domena: sqlmaniak.blog • LAN: 192.168.11.0/24 • VNN: SQLSRV-FCI • VIP: 192.168.11.60</text>

  <!-- DC -->
