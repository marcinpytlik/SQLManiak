name: bufferpool-research

services:
  sql2022:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sql2022-bufferpool-lab
    hostname: sql2022-bufferpool
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:?Set SQL_SA_PASSWORD in .env}
    ports:
      - "127.0.0.1:14334:1433"
    mem_limit: 16g
    cpus: 4
    volumes:
      - bufferpool_sql_data:/var/opt/mssql
    restart: "no"

volumes:
  bufferpool_sql_data:
