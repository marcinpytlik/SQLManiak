# Konfiguracja Telegraf
# Zbiera metryki z SQL Server (3 instancje) oraz metryki systemowe z kontenerow
# Wysyla dane do InfluxDB v2

[global_tags]
  env = "dev"
  app = "sqlmaniak-lab"

[agent]
  interval = "15s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "15s"
  flush_jitter = "0s"
  logfile = ""

[[outputs.influxdb_v2]]
  urls = [ "${INFLUXDB_URL}" ]
  token = "${INFLUXDB_TOKEN}"
  organization = "${INFLUXDB_ORG}"
  bucket = "${INFLUXDB_BUCKET}"
  timeout = "10s"

[[inputs.sqlserver]]
  servers = [
    "Server=sql2017;User Id=sa;Password=${SA_PASSWORD};Database=master;",
    "Server=sql2019;User Id=sa;Password=${SA_PASSWORD};Database=master;",
    "Server=sql2022;User Id=sa;Password=${SA_PASSWORD};Database=master;"
  ]
  query_version = 2
  include_query_text = false
  azuredb = false
  database_type = "SQLServer"

[[inputs.cpu]]
  percpu = false
  totalcpu = true
  fielddrop = ["time_*"]

[[inputs.mem]]
