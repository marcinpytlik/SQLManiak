name: Detect Grafana dashboard drift

on:
  workflow_dispatch:

  schedule:
    - cron: '17 3 * * *'

jobs:
  drift:
    name: Compare GitHub with Grafana
    runs-on:
      - self-hosted
      - Linux
      - ARM64

    permissions:
      contents: read

    env:
      DASHBOARD_DIR: scripts/DBACentralRepository_v3/grafana
      GRAFANA_NAMESPACE: default
      GRAFANA_FOLDER_UID: dbacentralrepository
      GRAFANA_URL: ${{ secrets.GRAFANA_URL }}
      GRAFANA_TOKEN: ${{ secrets.GRAFANA_TOKEN }}

    steps:
      - name: Checkout Grafana files
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            scripts/DBACentralRepository_v3/grafana
            scripts/DBACentralRepository_v3/Compare-GrafanaDrift.py
          sparse-checkout-cone-mode: false

      - name: Test Grafana API
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $GRAFANA_TOKEN" \
            "$GRAFANA_URL/api/health"
          echo

      - name: Compare GitHub with Grafana
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/DBACentralRepository_v3/Compare-GrafanaDrift.py
