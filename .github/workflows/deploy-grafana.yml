name: Deploy Grafana dashboards

on:
  workflow_dispatch:

  push:
    branches:
      - master
    paths:
      - 'scripts/DBACentralRepository_v3/grafana/*.json'
      - '.github/workflows/deploy-grafana.yml'

concurrency:
  group: grafana-dashboard-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy dashboards to Grafana
    runs-on:
      - self-hosted
      - Linux
      - ARM64

    permissions:
      contents: read

    env:
      DASHBOARD_DIR: scripts/DBACentralRepository_v3/grafana
      GRAFANA_NAMESPACE: default
      GRAFANA_URL: ${{ secrets.GRAFANA_URL }}
      GRAFANA_TOKEN: ${{ secrets.GRAFANA_TOKEN }}

    steps:
      - name: Checkout Grafana dashboards
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            scripts/DBACentralRepository_v3/grafana
          sparse-checkout-cone-mode: false

      - name: Show deployment context
        shell: bash
        run: |
          set -euo pipefail
          echo "Runner: $(hostname)"
          echo "Architecture: $(uname -m)"
          echo "Dashboard directory: $DASHBOARD_DIR"
          echo "Grafana namespace: $GRAFANA_NAMESPACE"
          echo "Grafana URL: $GRAFANA_URL"

      - name: Test Grafana API
        shell: bash
        run: |
          set -euo pipefail

          echo "Testing Grafana API..."

          curl \
            --fail \
            --silent \
            --show-error \
            --header "Authorization: Bearer $GRAFANA_TOKEN" \
            "$GRAFANA_URL/api/health"

          echo
          echo "Grafana API is reachable."

      - name: Validate dashboard files
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d "$DASHBOARD_DIR" ]; then
            echo "::error::Dashboard directory does not exist: $DASHBOARD_DIR"
            exit 1
          fi

          mapfile -t dashboards < <(
            find "$DASHBOARD_DIR" \
              -maxdepth 1 \
              -type f \
              -name '*.json' \
              -print | sort
          )

          if [ "${#dashboards[@]}" -eq 0 ]; then
            echo "::error::No Grafana dashboard JSON files found in $DASHBOARD_DIR"
            exit 1
          fi

          echo "Found ${#dashboards[@]} dashboard file(s)."

          for file in "${dashboards[@]}"; do
            echo "Validating: $file"

            api_version="$(python3 -c 'import json,sys; r=json.load(open(sys.argv[1], encoding="utf-8-sig")); print(r.get("apiVersion",""))' "$file")"
            kind="$(python3 -c 'import json,sys; r=json.load(open(sys.argv[1], encoding="utf-8-sig")); print(r.get("kind",""))' "$file")"
            name="$(python3 -c 'import json,sys; r=json.load(open(sys.argv[1], encoding="utf-8-sig")); print((r.get("metadata") or {}).get("name",""))' "$file")"
            title="$(python3 -c 'import json,sys; r=json.load(open(sys.argv[1], encoding="utf-8-sig")); print((r.get("spec") or {}).get("title",""))' "$file")"

            if [ -z "$api_version" ]; then
              echo "::error::$file has no apiVersion"
              exit 1
            fi

            if [[ "$api_version" != dashboard.grafana.app/* ]]; then
              echo "::error::$file has unsupported apiVersion: $api_version"
              exit 1
            fi

            if [ "$kind" != "Dashboard" ]; then
              echo "::error::$file has unsupported kind: $kind"
              exit 1
            fi

            if [ -z "$name" ]; then
              echo "::error::$file has no metadata.name"
              exit 1
            fi

            if [ -z "$title" ]; then
              echo "::error::$file has no spec.title"
              exit 1
            fi

            echo "  apiVersion: $api_version"
            echo "  kind:       $kind"
            echo "  name:       $name"
            echo "  title:      $title"
          done

      - name: Deploy dashboards using Grafana Resource API
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t dashboards < <(
            find "$DASHBOARD_DIR" \
              -maxdepth 1 \
              -type f \
              -name '*.json' \
              -print | sort
          )

          deployed=0
          created=0
          updated=0

          for file in "${dashboards[@]}"; do
            filename="$(basename "$file")"

            api_version="$(python3 -c 'import json,sys; r=json.load(open(sys.argv[1], encoding="utf-8-sig")); print(r["apiVersion"])' "$file")"
            api_group="${api_version%/*}"
            api_ver="${api_version##*/}"
            name="$(python3 -c 'import json,sys; r=json.load(open(sys.argv[1], encoding="utf-8-sig")); print(r["metadata"]["name"])' "$file")"
            title="$(python3 -c 'import json,sys; r=json.load(open(sys.argv[1], encoding="utf-8-sig")); print(r["spec"]["title"])' "$file")"

            collection_url="$GRAFANA_URL/apis/$api_group/$api_ver/namespaces/$GRAFANA_NAMESPACE/dashboards"
            resource_url="$collection_url/$name"

            echo
            echo "============================================================"
            echo "Dashboard: $title"
            echo "File:      $filename"
            echo "API:       $api_group/$api_ver"
            echo "Name:      $name"
            echo "============================================================"

            payload="$(mktemp)"
            response="$(mktemp)"

            python3 -c 'import json,sys; r=json.load(open(sys.argv[1], encoding="utf-8-sig")); m=r.get("metadata") or {}; a=m.get("annotations") or {}; md={"name":m["name"]}; folder=a.get("grafana.app/folder"); md["annotations"]={"grafana.app/message":"Deployed from GitHub Actions"}; folder and md["annotations"].__setitem__("grafana.app/folder",folder); labels=m.get("labels"); labels and md.__setitem__("labels",labels); out={"apiVersion":r["apiVersion"],"kind":"Dashboard","metadata":md,"spec":r["spec"]}; json.dump(out,open(sys.argv[2],"w",encoding="utf-8"),ensure_ascii=False,separators=(",",":"))' "$file" "$payload"

            get_code="$(
              curl \
                --silent \
                --show-error \
                --output "$response" \
                --write-out '%{http_code}' \
                --header "Authorization: Bearer $GRAFANA_TOKEN" \
                --header "Accept: application/json" \
                "$resource_url"
            )"

            if [ "$get_code" = "200" ]; then
              echo "Existing dashboard found -> UPDATE"

              http_code="$(
                curl \
                  --silent \
                  --show-error \
                  --output "$response" \
                  --write-out '%{http_code}' \
                  --request PUT \
                  --header "Authorization: Bearer $GRAFANA_TOKEN" \
                  --header "Accept: application/json" \
                  --header "Content-Type: application/json" \
                  --data-binary "@$payload" \
                  "$resource_url"
              )"

              action="updated"

            elif [ "$get_code" = "404" ]; then
              echo "Dashboard not found -> CREATE"

              http_code="$(
                curl \
                  --silent \
                  --show-error \
                  --output "$response" \
                  --write-out '%{http_code}' \
                  --request POST \
                  --header "Authorization: Bearer $GRAFANA_TOKEN" \
                  --header "Accept: application/json" \
                  --header "Content-Type: application/json" \
                  --data-binary "@$payload" \
                  "$collection_url"
              )"

              action="created"

            else
              echo "::error::Unable to determine dashboard state for $filename. GET returned HTTP $get_code"
              cat "$response"
              echo
              rm -f "$payload" "$response"
              exit 1
            fi

            if [[ "$http_code" =~ ^2 ]]; then
              echo "SUCCESS: $filename ($action)"
              deployed=$((deployed + 1))

              if [ "$action" = "created" ]; then
                created=$((created + 1))
              else
                updated=$((updated + 1))
              fi
            else
              echo "::error::Grafana deployment failed for $filename. HTTP $http_code"
              cat "$response"
              echo
              rm -f "$payload" "$response"
              exit 1
            fi

            rm -f "$payload" "$response"
          done

          echo
          echo "Deployment completed."
          echo "Total:   $deployed"
          echo "Created: $created"
          echo "Updated: $updated"

          {
            echo "DEPLOYED=$deployed"
            echo "CREATED=$created"
            echo "UPDATED=$updated"
          } >> "$GITHUB_ENV"

      - name: Deployment summary
        if: success()
        shell: bash
        run: |
          {
            echo "## Grafana dashboard deployment"
            echo
            echo "✅ Deployment completed successfully."
            echo
            echo "| Item | Value |"
            echo "|---|---:|"
            echo "| Total | $DEPLOYED |"
            echo "| Created | $CREATED |"
            echo "| Updated | $UPDATED |"
            echo
            echo "- Runner: \`$(hostname)\`"
            echo "- Architecture: \`$(uname -m)\`"
            echo "- Source: \`$DASHBOARD_DIR\`"
            echo "- Namespace: \`$GRAFANA_NAMESPACE\`"
          } >> "$GITHUB_STEP_SUMMARY"