name: Deploy Grafana dashboards

on:
  workflow_dispatch:

  push:
    branches:
      - master
    paths:
      - 'scripts/DBACentralRepository_v3/grafana/*.json'
      - '.github/workflows/deploy-grafana.yml'

concurrency:
  group: grafana-dashboard-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy dashboards to Grafana
    runs-on:
      - self-hosted
      - Linux
      - ARM64

    permissions:
      contents: read

    env:
      DASHBOARD_DIR: scripts/DBACentralRepository_v3/grafana
      GRAFANA_NAMESPACE: default
      GRAFANA_FOLDER_UID: dbacentralrepository
      GRAFANA_FOLDER_TITLE: DBACentralRepository
      GRAFANA_URL: ${{ secrets.GRAFANA_URL }}
      GRAFANA_TOKEN: ${{ secrets.GRAFANA_TOKEN }}

    steps:
      - name: Checkout Grafana dashboards
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            scripts/DBACentralRepository_v3/grafana
          sparse-checkout-cone-mode: false

      - name: Test Grafana API
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $GRAFANA_TOKEN" \
            "$GRAFANA_URL/api/health"
          echo

      - name: Ensure Grafana folder exists
        shell: bash
        run: |
          set -euo pipefail

          folder_url="$GRAFANA_URL/apis/folder.grafana.app/v1/namespaces/$GRAFANA_NAMESPACE/folders/$GRAFANA_FOLDER_UID"
          collection_url="$GRAFANA_URL/apis/folder.grafana.app/v1/namespaces/$GRAFANA_NAMESPACE/folders"
          response="$(mktemp)"

          code="$(curl --silent --show-error --output "$response" --write-out '%{http_code}' \
            --header "Authorization: Bearer $GRAFANA_TOKEN" \
            --header "Accept: application/json" \
            "$folder_url")"

          if [ "$code" = "200" ]; then
            echo "Folder already exists: $GRAFANA_FOLDER_TITLE"
          elif [ "$code" = "404" ]; then
            payload="$(mktemp)"

            python3 -c 'import json,sys; json.dump({"apiVersion":"folder.grafana.app/v1","kind":"Folder","metadata":{"name":sys.argv[1]},"spec":{"title":sys.argv[2]}},open(sys.argv[3],"w",encoding="utf-8"),ensure_ascii=False,separators=(",",":"))' \
              "$GRAFANA_FOLDER_UID" "$GRAFANA_FOLDER_TITLE" "$payload"

            create_code="$(curl --silent --show-error --output "$response" --write-out '%{http_code}' \
              --request POST \
              --header "Authorization: Bearer $GRAFANA_TOKEN" \
              --header "Content-Type: application/json" \
              --data-binary "@$payload" \
              "$collection_url")"

            rm -f "$payload"

            if [[ ! "$create_code" =~ ^2 ]]; then
              echo "::error::Unable to create Grafana folder. HTTP $create_code"
              cat "$response"
              rm -f "$response"
              exit 1
            fi

            echo "Created folder: $GRAFANA_FOLDER_TITLE"
          else
            echo "::error::Unable to query Grafana folder. HTTP $code"
            cat "$response"
            rm -f "$response"
            exit 1
          fi

          rm -f "$response"

      - name: Validate and deploy dashboards
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t dashboards < <(
            find "$DASHBOARD_DIR" -maxdepth 1 -type f -name '*.json' -print | sort
          )

          if [ "${#dashboards[@]}" -eq 0 ]; then
            echo "::error::No dashboard JSON files found."
            exit 1
          fi

          created=0
          updated=0

          for file in "${dashboards[@]}"; do
            api_version="$(python3 -c 'import json,sys; r=json.load(open(sys.argv[1],encoding="utf-8-sig")); print(r["apiVersion"])' "$file")"
            kind="$(python3 -c 'import json,sys; r=json.load(open(sys.argv[1],encoding="utf-8-sig")); print(r["kind"])' "$file")"
            name="$(python3 -c 'import json,sys; r=json.load(open(sys.argv[1],encoding="utf-8-sig")); print(r["metadata"]["name"])' "$file")"
            title="$(python3 -c 'import json,sys; r=json.load(open(sys.argv[1],encoding="utf-8-sig")); print(r["spec"]["title"])' "$file")"

            if [ "$kind" != "Dashboard" ]; then
              echo "::error::$file is not a Dashboard"
              exit 1
            fi

            api_group="${api_version%/*}"
            api_ver="${api_version##*/}"
            collection_url="$GRAFANA_URL/apis/$api_group/$api_ver/namespaces/$GRAFANA_NAMESPACE/dashboards"
            resource_url="$collection_url/$name"

            payload="$(mktemp)"
            response="$(mktemp)"

            python3 -c 'import copy,json,sys; source,target,folder_uid=sys.argv[1:4]; root=json.load(open(source,encoding="utf-8-sig")); spec=copy.deepcopy(root["spec"]); tags=list(spec.get("tags") or []); [tags.append(t) for t in ("DBACentralRepository","ManagedByGitHub") if t not in tags]; spec["tags"]=tags; payload={"apiVersion":root["apiVersion"],"kind":"Dashboard","metadata":{"name":root["metadata"]["name"],"annotations":{"grafana.app/folder":folder_uid,"grafana.app/message":"Deployed from GitHub Actions"}},"spec":spec}; json.dump(payload,open(target,"w",encoding="utf-8"),ensure_ascii=False,separators=(",",":"))' \
              "$file" "$payload" "$GRAFANA_FOLDER_UID"

            get_code="$(curl --silent --show-error --output "$response" --write-out '%{http_code}' \
              --header "Authorization: Bearer $GRAFANA_TOKEN" \
              "$resource_url")"

            if [ "$get_code" = "200" ]; then
              method="PUT"
              url="$resource_url"
              action="updated"
            elif [ "$get_code" = "404" ]; then
              method="POST"
              url="$collection_url"
              action="created"
            else
              echo "::error::Unable to determine dashboard state for $name. HTTP $get_code"
              cat "$response"
              rm -f "$payload" "$response"
              exit 1
            fi

            code="$(curl --silent --show-error --output "$response" --write-out '%{http_code}' \
              --request "$method" \
              --header "Authorization: Bearer $GRAFANA_TOKEN" \
              --header "Content-Type: application/json" \
              --data-binary "@$payload" \
              "$url")"

            if [[ ! "$code" =~ ^2 ]]; then
              echo "::error::Deploy failed for $name. HTTP $code"
              cat "$response"
              rm -f "$payload" "$response"
              exit 1
            fi

            echo "SUCCESS: $title ($action)"

            if [ "$action" = "created" ]; then
              created=$((created + 1))
            else
              updated=$((updated + 1))
            fi

            rm -f "$payload" "$response"
          done

          {
            echo "## Grafana deployment"
            echo
            echo "✅ Deployment completed successfully."
            echo
            echo "- Folder: \`$GRAFANA_FOLDER_TITLE\`"
            echo "- Created: $created"
            echo "- Updated: $updated"
            echo "- Tags: \`DBACentralRepository\`, \`ManagedByGitHub\`"
          } >> "$GITHUB_STEP_SUMMARY"