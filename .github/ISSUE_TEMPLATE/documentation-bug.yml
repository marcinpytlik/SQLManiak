name: Documentation bug
description: Report a broken link, incorrect instruction or outdated canonical documentation.
title: "[Docs Bug] "
labels: ["documentation", "bug"]
body:
  - type: input
    id: path
    attributes:
      label: File / path
      placeholder: runbooks/.../RUNBOOK.md
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: Problem
      description: Describe what is wrong.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected content or behavior
    validations:
      required: true
  - type: dropdown
    id: impact
    attributes:
      label: Impact
      options:
        - Broken navigation / link
        - Misleading instruction
        - Operational risk
        - Outdated reference
        - Typo / formatting
    validations:
      required: true
