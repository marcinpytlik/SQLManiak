name: Legacy / reference cleanup
description: Classify, cross-link or deprecate an older artifact.
title: "[Cleanup] "
labels: ["documentation"]
body:
  - type: input
    id: path
    attributes:
      label: Artifact path
    validations:
      required: true
  - type: dropdown
    id: status
    attributes:
      label: Proposed lifecycle status
      options:
        - ACTIVE
        - REFERENCE
        - LAB
        - LEGACY
        - ARCHIVED
        - Needs review
    validations:
      required: true
  - type: input
    id: canonical
    attributes:
      label: Canonical entry point
  - type: textarea
    id: rationale
    attributes:
      label: Rationale
    validations:
      required: true
