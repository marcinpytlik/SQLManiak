        type: CALCULATED
        key: mssql.db.cpu_capacity_pct["{#DBNAME}"]
        delay: 1m
        value_type: FLOAT
        units: '%'
        params: 100 * last(//mssql.db.cpu_ms_per_sec["{#DBNAME}"]) / (1000 * (last(//mssql.cpu.sql_visible_schedulers) + (last(//mssql.cpu.sql_visible_schedulers)=0)))
