    - uuid: e88c4f4f0fda430d9496e4f1de591601
      name: Safe auto-params per second
      type: DEPENDENT
      key: mssql.safe_autoparams_sec.rate
      value_type: FLOAT
      description: Number of safe auto-parameterization attempts per second. Safe refers to a determination that a cached execution plan can be shared between different
        similar-looking Transact-SQL statements. SQL Server makes many auto-parameterization attempts, some of which turn out to be safe and others fail. Note that
        auto-parameterizations are also known as simple parameterizations in the newer versions of SQL Server. This does not include forced parameterizations.
      preprocessing:
      - type: JSONPATH
        parameters:
        - $[?(@.counter_name=='Safe Auto-Params/sec')].cntr_value.first()
      - type: CHANGE_PER_SECOND
      master_item:
        key: mssql.sql_statistics.raw
      tags:
      - tag: component
        value: performance
    - uuid: aef02edb1a8c48949cfc8daa83f10b07
      name: Full scans to Index searches ratio
      type: CALCULATED
      key: mssql.scan_to_search
      delay: 0;m0-59s3
      value_type: FLOAT
      params: last(//mssql.full_scans_sec.rate) / (last(//mssql.index_searches_sec.rate) + (last(//mssql.index_searches_sec.rate)=0))
      description: The ratio of full scans per second to index searches per second. The threshold recommendation is strictly for OLTP workloads.
      tags:
      - tag: component
        value: application
      triggers:
      - uuid: 463d6bf7699d48d294e247bc14bff1f5
        expression: min(/SQLManiak MSSQL by Zabbix agent 2/mssql.scan_to_search,15m) > 0.001
        name: 'MSSQL: Number of index and table scans exceeds index searches in the last 15m'
        priority: WARNING
        description: Index searches are preferable to index and table scans. For OLTP applications, optimize for more index searches and less scans (preferably, 1
          full scan for every 1000 index searches). Index and table scans are expensive I/O operations.
        tags:
        - tag: scope
          value: performance
        status: DISABLED
    - uuid: e623b8d069ab4ffabc29d0fe70c636fd
