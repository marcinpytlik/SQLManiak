          value: performance
        status: DISABLED
    - uuid: 2e31e33dd7d44876ae6d10d87189e284
      name: Service's TCP port state
      type: SIMPLE
      key: net.tcp.service[tcp,{$MSSQL.HOST},{$MSSQL.PORT}]
