        name: 'MSSQL AG ''{#GROUP_NAME}'' Local DB ''{#DBNAME}'': State'
        type: DEPENDENT
        key: mssql.local_db.state["{#DBNAME}"]
        description: '0 = Online

          1 = Restoring

          2 = Recovering

          3 = Recovery pending

          4 = Suspect

          5 = Emergency

          6 = Offline

          '
        valuemap:
          name: MSSQL DB state
        preprocessing:
        - type: JSONPATH
          parameters:
          - $[?(@.dbname=='{#DBNAME}' && @.group_name=='{#GROUP_NAME}')].database_state.first()
        - type: DISCARD_UNCHANGED_HEARTBEAT
          parameters:
