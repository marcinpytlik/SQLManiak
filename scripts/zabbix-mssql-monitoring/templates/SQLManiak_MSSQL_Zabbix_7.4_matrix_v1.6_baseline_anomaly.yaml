    - uuid: fa514ab2d0e540b186f858e47cdf9b45
      name: 'SQLManiak E2E: raw'
      type: EXTERNAL
      key: sqlmaniak_mssql_e2e.sh["{HOST.CONN}","{$MSSQL.E2E.AGENT.PORT}","{$MSSQL.URI}"]
      delay: 1m
      history: 1d
      value_type: TEXT
      description: Server-side E2E probe. Zabbix server/proxy runs sqlmaniak_mssql_e2e.sh, which calls zabbix_get against Agent 2 and executes sqlmaniak_e2e via the
        MSSQL plugin. Requires {$MSSQL.URI} to resolve to an Agent 2 MSSQL named session when no credentials are passed.
      tags:
      - tag: component
        value: e2e
      - tag: scope
        value: availability
    - uuid: 5db4384817014035908d9986e40b6319
      name: 'SQLManiak E2E: connectivity status'
      type: DEPENDENT
      key: mssql.e2e.status
      history: 7d
      description: 1 = full Zabbix server/proxy -> Agent 2 -> MSSQL plugin -> SQL query path succeeded; 0 = failed.
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.status
        error_handler: CUSTOM_VALUE
        error_handler_params: '0'
      master_item:
        key: sqlmaniak_mssql_e2e.sh["{HOST.CONN}","{$MSSQL.E2E.AGENT.PORT}","{$MSSQL.URI}"]
      tags:
      - tag: component
        value: e2e
      - tag: scope
        value: availability
      triggers:
      - uuid: a09b79d1dfcb4674a38d9f4a95dbb954
        expression: max(/SQLManiak MSSQL by Zabbix agent 2/mssql.e2e.status,#3)=0
        recovery_mode: RECOVERY_EXPRESSION
        recovery_expression: min(/SQLManiak MSSQL by Zabbix agent 2/mssql.e2e.status,#2)=1
        name: 'MSSQL: E2E SQL path unavailable'
        priority: HIGH
        description: Three consecutive server/proxy-side E2E probes failed. This check covers Zabbix server/proxy -> Agent 2 -> MSSQL plugin -> SQL Server -> test
          query.
        tags:
        - tag: component
          value: e2e
        - tag: service
          value: mssql
        - tag: priority
          value: P1
    - uuid: 094a048cc3bd49ddadfdd7cc65044c31
      name: 'SQLManiak E2E: response time'
      type: DEPENDENT
      key: mssql.e2e.response_ms
      history: 30d
      description: Round-trip duration measured on the Zabbix server/proxy around zabbix_get, in milliseconds.
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.response_ms
        error_handler: CUSTOM_VALUE
        error_handler_params: '0'
      master_item:
        key: sqlmaniak_mssql_e2e.sh["{HOST.CONN}","{$MSSQL.E2E.AGENT.PORT}","{$MSSQL.URI}"]
      tags:
      - tag: component
        value: e2e
      - tag: scope
        value: availability
      value_type: FLOAT
      units: ms
      trends: 365d
    - uuid: 385d479091f84712baf88081ccaba4fa
      name: 'SQLManiak E2E: zabbix_get return code'
      type: DEPENDENT
      key: mssql.e2e.zabbix_get_rc
      history: 7d
      description: Return code from zabbix_get used by the E2E wrapper.
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.zabbix_get_rc
        error_handler: CUSTOM_VALUE
        error_handler_params: '0'
      master_item:
        key: sqlmaniak_mssql_e2e.sh["{HOST.CONN}","{$MSSQL.E2E.AGENT.PORT}","{$MSSQL.URI}"]
      tags:
      - tag: component
        value: e2e
      - tag: scope
        value: availability
    - uuid: 3f41285252b04f60a11939bdb0248a33
      name: 'SQLManiak E2E: SQL UTC timestamp'
      type: DEPENDENT
      key: mssql.e2e.sql_utc
      history: 1d
      description: UTC timestamp returned by SQL Server during the E2E probe.
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.sql_utc
        error_handler: CUSTOM_VALUE
        error_handler_params: ''
      master_item:
        key: sqlmaniak_mssql_e2e.sh["{HOST.CONN}","{$MSSQL.E2E.AGENT.PORT}","{$MSSQL.URI}"]
      tags:
      - tag: component
        value: e2e
      - tag: scope
        value: availability
      value_type: TEXT
    - uuid: 510ca4ab99a94fb7a9cbfab526c322f4
      name: 'SQLManiak E2E: baseline average 1h'
      type: CALCULATED
      key: mssql.e2e.baseline.avg1h
      delay: 5m
      history: 30d
      value_type: FLOAT
      params: avg(//mssql.e2e.response_ms,1h)
      description: Rolling 1-hour average of E2E SQL response time. Works immediately as history accumulates.
      tags:
      - tag: component
        value: e2e
      - tag: scope
        value: baseline
      units: ms
      trends: 365d
    - uuid: 8528ee695e8840a9be035a5aa000e38a
      name: 'SQLManiak E2E: baseline average 24h'
      type: CALCULATED
      key: mssql.e2e.baseline.avg24h
      delay: 5m
      history: 30d
      value_type: FLOAT
      params: avg(//mssql.e2e.response_ms,24h)
      description: Rolling 24-hour average of E2E SQL response time. Used as a short-term baseline.
      tags:
      - tag: component
        value: e2e
      - tag: scope
        value: baseline
      units: ms
      trends: 365d
    - uuid: 341bb3de7ff04ccb903fb2c6c399efcb
      name: 'SQLManiak E2E: baseline MAD 24h'
      type: CALCULATED
      key: mssql.e2e.baseline.mad24h
      delay: 5m
      history: 30d
      value_type: FLOAT
      params: mad(//mssql.e2e.response_ms,24h)
      description: Median absolute deviation of E2E SQL response time over 24 hours. Robust dispersion measure for anomaly scoring.
      tags:
      - tag: component
        value: e2e
      - tag: scope
        value: baseline
      units: ms
      trends: 365d
    - uuid: 5e37df6551b54077a10bd5aa32513135
      name: 'SQLManiak E2E: anomaly score 24h'
      type: CALCULATED
      key: mssql.e2e.anomaly.score24h
      delay: 5m
      history: 30d
      value_type: FLOAT
      params: abs(last(//mssql.e2e.response_ms)-avg(//mssql.e2e.response_ms,24h))/(mad(//mssql.e2e.response_ms,24h)+1)
      description: 'Robust anomaly score: absolute distance between current E2E response time and the 24-hour average, divided by MAD+1. Informational only in v1.6;
        no trigger threshold is enabled.'
      tags:
      - tag: component
        value: e2e
      - tag: scope
        value: baseline
      trends: 365d
    - uuid: ca33990ccb794f9f8706c61794c95c81
      name: 'SQLManiak E2E: current vs 24h baseline ratio'
      type: CALCULATED
      key: mssql.e2e.baseline.ratio24h
      delay: 5m
      history: 30d
      value_type: FLOAT
      params: last(//mssql.e2e.response_ms)/(avg(//mssql.e2e.response_ms,24h)+1)
      description: Current E2E response time divided by the rolling 24-hour average (+1 ms guard). 1.0 means approximately baseline; >1 means slower than baseline.
      tags:
      - tag: component
        value: e2e
      - tag: scope
        value: baseline
      trends: 365d
    - uuid: 9f73b6bab8e64c97bd66ab4a5e433fc2
      name: 'SQLManiak E2E: seasonal baseline same hour 7d'
      type: CALCULATED
      key: mssql.e2e.baseline.seasonal7d
      delay: 1h
      history: 30d
      value_type: FLOAT
      params: baselinewma(//mssql.e2e.response_ms,1h:now/h,"d",7)
      description: 'Seasonal baseline using Zabbix baselinewma: same full hour-of-day across the previous 7 days. Requires sufficient trend history; expect a warm-up
        period before values become meaningful.'
      tags:
      - tag: component
        value: e2e
      - tag: scope
        value: baseline
      units: ms
      trends: 365d
    - uuid: 29dd01d10d634c85b06fe35c894a57dc
      name: 'SQLManiak E2E: seasonal deviation same hour 7d'
      type: CALCULATED
      key: mssql.e2e.anomaly.seasonaldev7d
      delay: 1h
      history: 30d
      value_type: FLOAT
      params: baselinedev(//mssql.e2e.response_ms,1h:now/h,"d",7)
      description: Zabbix baselinedev for the previous full hour compared with the same hour-of-day in the prior 7 days. Returns the number of population-standard-deviation
        units. Informational only; no trigger in v1.6.
      tags:
      - tag: component
        value: e2e
      - tag: scope
        value: baseline
      trends: 365d
    discovery_rules:
    - uuid: cc64fb5162fe4ad38393986baaa24872
      name: Availability group discovery
      type: DEPENDENT
      key: mssql.availability.group.discovery
      description: Discovery of the existing availability groups.
      item_prototypes:
      - uuid: 4ca2a7dcd7394ef39f18647a773148f7
        name: 'MSSQL AG ''{#GROUP_NAME}'': Primary replica recovery health'
        type: DEPENDENT
        key: mssql.primary_recovery_health["{#GROUP_NAME}"]
        description: 'Indicates the recovery health of the primary replica:

          0 = In progress

          1 = Online

          2 = Unavailable

          '
        valuemap:
          name: MSSQL AG Recovery health
        preprocessing:
        - type: JSONPATH
          parameters:
          - $[?(@.group_name=='{#GROUP_NAME}')].primary_recovery_health.first()
        - type: DISCARD_UNCHANGED_HEARTBEAT
          parameters:
          - 1h
        master_item:
          key: mssql.availability.group.get["{$MSSQL.URI}","{$MSSQL.USER}","{$MSSQL.PASSWORD}"]
        tags:
        - tag: availability-group
          value: '{#GROUP_NAME}'
        - tag: component
          value: availability-group
        trigger_prototypes:
        - uuid: f254e53afe6c4a7a8e091545fced044f
          expression: last(/SQLManiak MSSQL by Zabbix agent 2/mssql.primary_recovery_health["{#GROUP_NAME}"])=0
          name: 'MSSQL: AG ''{#GROUP_NAME}'': Primary replica recovery health in progress'
          priority: WARNING
          description: The primary replica is in the synchronization process.
          tags:
          - tag: availability-group
            value: '{#GROUP_NAME}'
          - tag: scope
            value: notice
      - uuid: 41014e41247249ecbae3f5e5beeeef90
        name: 'MSSQL AG ''{#GROUP_NAME}'': Primary replica name'
        type: DEPENDENT
        key: mssql.primary_replica["{#GROUP_NAME}"]
        value_type: CHAR
        description: Name of the server instance that is hosting the current primary replica.
        preprocessing:
        - type: JSONPATH
          parameters:
          - $[?(@.group_name=='{#GROUP_NAME}')].primary_replica.first()
        - type: DISCARD_UNCHANGED_HEARTBEAT
          parameters:
          - 3h
        master_item:
          key: mssql.availability.group.get["{$MSSQL.URI}","{$MSSQL.USER}","{$MSSQL.PASSWORD}"]
        tags:
        - tag: availability-group
          value: '{#GROUP_NAME}'
        - tag: component
          value: availability-group
      - uuid: 5efc15c51d734b198385ffbbd051e71a
        name: 'MSSQL AG ''{#GROUP_NAME}'': Secondary replica recovery health'
        type: DEPENDENT
        key: mssql.secondary_recovery_health["{#GROUP_NAME}"]
        description: 'Indicates the recovery health of a secondary replica:

          0 = In progress

          1 = Online

          2 = Unavailable

          '
        valuemap:
          name: MSSQL AG Recovery health
        preprocessing:
        - type: JSONPATH
          parameters:
          - $[?(@.group_name=='{#GROUP_NAME}')].secondary_recovery_health.first()
        - type: DISCARD_UNCHANGED_HEARTBEAT
          parameters:
          - 1h
        master_item:
          key: mssql.availability.group.get["{$MSSQL.URI}","{$MSSQL.USER}","{$MSSQL.PASSWORD}"]
        tags:
        - tag: availability-group
          value: '{#GROUP_NAME}'
        - tag: component
          value: availability-group
        trigger_prototypes:
        - uuid: 131a23c32b1b4107a49bc811ca3c2fa3
          expression: last(/SQLManiak MSSQL by Zabbix agent 2/mssql.secondary_recovery_health["{#GROUP_NAME}"])=0
          name: 'MSSQL: AG ''{#GROUP_NAME}'': Secondary replica recovery health in progress'
          priority: WARNING
          description: The secondary replica is in the synchronization process.
          tags:
          - tag: availability-group
            value: '{#GROUP_NAME}'
          - tag: scope
            value: notice
      - uuid: 46a5a609fb23445b99a4a68d4f6bb3c7
        name: 'MSSQL AG ''{#GROUP_NAME}'': Synchronization health'
        type: DEPENDENT
        key: mssql.synchronization_health["{#GROUP_NAME}"]
        description: 'Reflects a rollup of the `synchronization_health` of all availability replicas in the availability group:

          0 = Not healthy. None of the availability replicas have a healthy synchronization.

          1 = Partially healthy. The synchronization of some, but not all, availability replicas is healthy.

          2 = Healthy. The synchronization of every availability replica is healthy.

          '
        valuemap:
          name: MSSQL AG Synchronization health
        preprocessing:
        - type: JSONPATH
          parameters:
          - $[?(@.group_name=='{#GROUP_NAME}')].synchronization_health.first()
        - type: DISCARD_UNCHANGED_HEARTBEAT
          parameters:
          - 1h
        master_item:
          key: mssql.availability.group.get["{$MSSQL.URI}","{$MSSQL.USER}","{$MSSQL.PASSWORD}"]
        tags:
        - tag: availability-group
          value: '{#GROUP_NAME}'
        - tag: component
          value: availability-group
        trigger_prototypes:
        - uuid: aa6986dabebb431f95b0d439dedb34b9
          expression: last(/SQLManiak MSSQL by Zabbix agent 2/mssql.synchronization_health["{#GROUP_NAME}"])=0
          name: 'MSSQL: AG ''{#GROUP_NAME}'': All replicas unhealthy'
          priority: DISASTER
          description: None of the availability replicas have a healthy synchronization.
          tags:
          - tag: availability-group
            value: '{#GROUP_NAME}'
          - tag: scope
            value: availability
        - uuid: 1d9e5d4c87524be19e34acf5889c3db1
          expression: last(/SQLManiak MSSQL by Zabbix agent 2/mssql.synchronization_health["{#GROUP_NAME}"])=1
          name: 'MSSQL: AG ''{#GROUP_NAME}'': Some replicas unhealthy'
          priority: HIGH
          description: The synchronization health of some, but not all, availability replicas is healthy.
          tags:
          - tag: availability-group
            value: '{#GROUP_NAME}'
          - tag: scope
            value: availability
      master_item:
        key: mssql.availability.group.get["{$MSSQL.URI}","{$MSSQL.USER}","{$MSSQL.PASSWORD}"]
      lld_macro_paths:
      - lld_macro: '{#GROUP_NAME}'
        path: $.group_name
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1d
    - uuid: 4232485dec31440a8f17b3ff03bd595a
      name: Database discovery
      type: DEPENDENT
      key: mssql.database.discovery
      filter:
        evaltype: AND
        conditions:
        - macro: '{#DBNAME}'
          value: '{$MSSQL.DBNAME.MATCHES}'
        - macro: '{#DBNAME}'
          value: '{$MSSQL.DBNAME.NOT_MATCHES}'
          operator: NOT_MATCHES_REGEX
      description: Scanning databases in DBMS.
      item_prototypes:
      - uuid: 4f05403281104846ab4d0abc7721a5fe
        name: 'MSSQL DB ''{#DBNAME}'': Last diff backup duration'
        type: DEPENDENT
        key: mssql.backup.diff.duration["{#DBNAME}"]
        units: s
        description: Duration of the last differential backup.
        preprocessing:
        - type: JSONPATH
          parameters:
          - $[?(@.type=='I')].duration.first()
