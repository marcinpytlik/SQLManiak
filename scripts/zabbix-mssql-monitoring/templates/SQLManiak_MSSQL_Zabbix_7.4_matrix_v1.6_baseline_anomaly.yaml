    - uuid: 57c9385a6a444bd5888e05c66135212b
      name: Page reads per second
      type: DEPENDENT
      key: mssql.page_reads_sec.rate
      value_type: FLOAT
      description: Indicates the number of physical database page reads that are issued per second. This statistic displays the total number of physical page reads
        across all databases. As physical I/O is expensive, you may be able to minimize the cost either by using a larger data cache, intelligent indexes, and more
        efficient queries, or by changing the database design.
      preprocessing:
      - type: JSONPATH
        parameters:
        - $[?(@.counter_name=='Page reads/sec')].cntr_value.first()
      - type: CHANGE_PER_SECOND
      master_item:
        key: mssql.buffer_manager.raw
      tags:
