        key: mssql.locks_info.raw
      tags:
      - tag: component
        value: deadlock
      - tag: component
        value: performance
      triggers:
      - uuid: 02aefabceba04b8eb9fce5e5ef589645
        expression: min(/SQLManiak MSSQL by Zabbix agent 2/mssql.number_deadlocks_sec.rate,5m)>{$MSSQL.DEADLOCKS.MAX}
        name: 'MSSQL: Number of deadlocks is high'
        event_name: 'MSSQL: Number of deadlocks is high (over {$MSSQL.DEADLOCKS.MAX} for 5m)'
        priority: AVERAGE
        description: Too many deadlocks are occurring currently.
        tags:
        - tag: scope
          value: performance
        status: DISABLED
      - uuid: 1d20f1349fd34c04aab2fab4afa1019a
        expression: sum(/SQLManiak MSSQL by Zabbix agent 2/mssql.number_deadlocks_sec.rate,10m)>={$MSSQL.DEADLOCK.CRIT.COUNT}
        name: 'MSSQL: Deadlock burst detected'
        priority: HIGH
        description: P2 multiple deadlocks in a 10-minute window.
        tags:
        - tag: component
          value: locks
        - tag: symptom
          value: deadlock
        - tag: priority
          value: P2
      - uuid: 0efb75debb734eb9a98a3164c91a7a4f
        expression: sum(/SQLManiak MSSQL by Zabbix agent 2/mssql.number_deadlocks_sec.rate,10m)>0
        name: 'MSSQL: Deadlock detected'
        priority: WARNING
        dependencies:
        - name: 'MSSQL: Deadlock burst detected'
          expression: sum(/SQLManiak MSSQL by Zabbix agent 2/mssql.number_deadlocks_sec.rate,10m)>={$MSSQL.DEADLOCK.CRIT.COUNT}
        description: P2 at least one deadlock observed in the last 10 minutes.
        tags:
        - tag: component
          value: locks
        - tag: symptom
          value: deadlock
        - tag: priority
          value: P2
    - uuid: 59d7c75bf4054e7e9ae267801a8659ba
