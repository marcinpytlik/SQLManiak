      - tag: component
        value: performance
    - uuid: 75ba6fd489334559be83b017d746a160
      name: Failed auto-params per second
      type: DEPENDENT
      key: mssql.failed_autoparams_sec.rate
      value_type: FLOAT
      description: Number of failed auto-parameterization attempts per second. This number should be small. Note that auto-parameterizations are also known as simple
        parameterizations in the newer versions of SQL Server.
      preprocessing:
