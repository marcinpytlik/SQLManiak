      - uuid: 074f11b5a3c24738b4141141d0c972e3
        name: 'MSSQL Mirroring ''{#DBNAME}'': State'
        type: DEPENDENT
        key: mssql.mirroring.state["{#DBNAME}"]
        description: 'State of the mirror database and of the database mirroring session.

          0 = Suspended

          1 = Disconnected from the other partner

          2 = Synchronizing

          3 = Pending failover

          4 = Synchronized

          5 = The partners are not synchronized. Failover is not possible now.

          6 = The partners are synchronized. Failover is potentially possible. For information about the requirements for the failover, see Database Mirroring Operating
          Modes: https://learn.microsoft.com/en-us/sql/database-engine/database-mirroring/database-mirroring-operating-modes?view=sql-server-ver16.

          '
