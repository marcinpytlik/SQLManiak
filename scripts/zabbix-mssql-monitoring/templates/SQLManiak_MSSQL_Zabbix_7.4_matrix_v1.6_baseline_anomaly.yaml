    - uuid: 5229092766dd45a29d06b4fce5b3ebad
      name: Uptime
      type: DEPENDENT
      key: mssql.uptime
      trends: '0'
      units: uptime
      description: MSSQL Server uptime in the format "N days, hh:mm:ss".
      preprocessing:
      - type: JSONPATH
        parameters:
        - $[?(@.counter_name=='Uptime')].cntr_value.first()
      master_item:
        key: mssql.perfcounter.get["{$MSSQL.URI}","{$MSSQL.USER}","{$MSSQL.PASSWORD}"]
      tags:
      - tag: component
        value: application
      triggers:
      - uuid: 851a209984044c9e8d462fc57574493b
        expression: nodata(/SQLManiak MSSQL by Zabbix agent 2/mssql.uptime,30m)=1
        name: 'MSSQL: Failed to fetch info data'
        event_name: 'MSSQL: Failed to fetch info data (or no data for 30m)'
        priority: INFO
        description: Zabbix has not received any data for items for the last 30 minutes.
        dependencies:
        - name: 'MSSQL: Service is unavailable'
          expression: last(/SQLManiak MSSQL by Zabbix agent 2/net.tcp.service[tcp,{$MSSQL.HOST},{$MSSQL.PORT}])=0
        tags:
        - tag: scope
          value: availability
        status: DISABLED
      - uuid: 73de9d5304c04a6e9ea2b355b049f66f
        expression: last(/SQLManiak MSSQL by Zabbix agent 2/mssql.uptime)<10m
        name: 'MSSQL: Service has been restarted'
        event_name: 'MSSQL: Service has been restarted (uptime < 10m)'
        priority: INFO
        description: Uptime is less than 10 minutes.
        manual_close: 'YES'
        tags:
        - tag: scope
          value: notice
        status: DISABLED
      - uuid: 633a72c22c514a6e98c3416127172bfe
        expression: last(/SQLManiak MSSQL by Zabbix agent 2/mssql.uptime)<{$MSSQL.UPTIME.RESTART.WINDOW} and nodata(/SQLManiak MSSQL by Zabbix agent 2/mssql.uptime,5m)=0
        name: 'MSSQL: SQL Server restarted unexpectedly'
        priority: HIGH
        dependencies:
        - name: 'MSSQL: TCP port unavailable'
          expression: max(/SQLManiak MSSQL by Zabbix agent 2/net.tcp.service[tcp,{$MSSQL.HOST},{$MSSQL.PORT}],{$MSSQL.TCP.FAIL.COUNT})=0
          recovery_expression: min(/SQLManiak MSSQL by Zabbix agent 2/net.tcp.service[tcp,{$MSSQL.HOST},{$MSSQL.PORT}],{$MSSQL.TCP.RECOVERY.COUNT})=1
        tags:
        - tag: component
          value: availability
        - tag: service
          value: mssql
        - tag: event
          value: restart
        - tag: scope
          value: instance
        - tag: priority
          value: P1
        recovery_mode: RECOVERY_EXPRESSION
        recovery_expression: last(/SQLManiak MSSQL by Zabbix agent 2/mssql.uptime)>={$MSSQL.UPTIME.RESTART.WINDOW}
        description: P1 unexpected SQL Server restart. Planned restarts should be covered by Zabbix maintenance.
      - uuid: 1209c35b13094f429ee4796a149f5751
        expression: nodata(/SQLManiak MSSQL by Zabbix agent 2/mssql.uptime,{$MSSQL.ODBC.NODATA})=1 and last(/SQLManiak MSSQL by Zabbix agent 2/net.tcp.service[tcp,{$MSSQL.HOST},{$MSSQL.PORT}])=1
        recovery_mode: RECOVERY_EXPRESSION
        recovery_expression: nodata(/SQLManiak MSSQL by Zabbix agent 2/mssql.uptime,2m)=0
        name: 'MSSQL: Monitoring channel unavailable while TCP is reachable'
        priority: HIGH
        description: TCP is reachable but MSSQL plugin/dependent monitoring data stopped arriving. Check plugin/session/auth/query path.
        tags:
        - tag: component
          value: availability
        - tag: service
          value: mssql
        - tag: layer
          value: agent2-plugin
        - tag: scope
          value: instance
        - tag: priority
