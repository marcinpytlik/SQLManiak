          value: '{#GROUP_NAME}'
        - tag: component
          value: local-db
        - tag: local-db
          value: '{#DBNAME}'
        trigger_prototypes:
        - uuid: d91a28afc37d44188f36d140a214469a
          expression: last(/SQLManiak MSSQL by Zabbix agent 2/mssql.local_db.state["{#DBNAME}"])>0
          name: 'MSSQL: AG ''{#GROUP_NAME}'' Local DB ''{#DBNAME}'': "{#DBNAME}" is {ITEM.VALUE}'
          priority: WARNING
          description: The local availability database has a non-working state.
          tags:
          - tag: availability-group
            value: '{#GROUP_NAME}'
          - tag: local-db
            value: '{#DBNAME}'
          - tag: scope
            value: availability
      - uuid: 34407f2071ec47d8bf68e47d18b17d29
        name: 'MSSQL AG ''{#GROUP_NAME}'' Local DB ''{#DBNAME}'': Synchronization health'
        type: DEPENDENT
        key: mssql.local_db.synchronization_health["{#DBNAME}"]
        description: 'Reflects the intersection of the synchronization state of a database that is joined to the availability group on the availability replica and
          the availability mode of the availability replica (synchronous-commit or asynchronous-commit mode):

          0 = Not healthy. The synchronization_state of the database is 0 ("Not synchronizing").

          1 = Partially healthy. A database on a synchronous-commit availability replica is considered partially healthy if synchronization_state is 1 ("Synchronizing").

          2 = Healthy. A database on an synchronous-commit availability replica is considered healthy if synchronization_state is 2 ("Synchronized"), and a database
          on an asynchronous-commit availability replica is considered healthy if synchronization_state is 1 ("Synchronizing").

          '
        valuemap:
          name: MSSQL AG Synchronization health
        preprocessing:
        - type: JSONPATH
          parameters:
          - $[?(@.dbname=='{#DBNAME}' && @.group_name=='{#GROUP_NAME}')].synchronization_health.first()
        - type: DISCARD_UNCHANGED_HEARTBEAT
