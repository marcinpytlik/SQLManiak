        name: 'Mirroring ''{#DBNAME}'': States'
        graph_items:
        - color: 199C0D
          item:
            host: SQLManiak MSSQL by Zabbix agent 2
            key: mssql.mirroring.state["{#DBNAME}"]
        - sortorder: '1'
          color: F63100
          item:
            host: SQLManiak MSSQL by Zabbix agent 2
            key: mssql.mirroring.witness_state["{#DBNAME}"]
      master_item:
        key: mssql.mirroring.get["{$MSSQL.URI}","{$MSSQL.USER}","{$MSSQL.PASSWORD}"]
