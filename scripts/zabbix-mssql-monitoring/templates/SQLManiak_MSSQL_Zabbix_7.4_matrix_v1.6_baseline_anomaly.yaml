        units: '%'
        params: 100 * last(//mssql.db.cpu_time_ms.delta["{#DBNAME}"]) / (sum(last_foreach(//mssql.db.cpu_time_ms.delta[*])) + (sum(last_foreach(//mssql.db.cpu_time_ms.delta[*]))=0))
