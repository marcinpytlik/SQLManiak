          - tag: scope
            value: availability
        - uuid: 63e2e989c5e6407fba73e883cf35c845
          expression: last(/SQLManiak MSSQL by Zabbix agent 2/mssql.mirroring.state["{#DBNAME}"])=5
          name: 'MSSQL: Mirroring ''{#DBNAME}'': "{#DBNAME}" is {ITEM.VALUE}'
          priority: HIGH
          description: The state of the mirror database and of the database mirroring session is "Not synchronized". The partners are not synchronized. A failover
            is not possible now.
          tags:
          - tag: mssql-mirroring
            value: '{#DBNAME}'
          - tag: scope
