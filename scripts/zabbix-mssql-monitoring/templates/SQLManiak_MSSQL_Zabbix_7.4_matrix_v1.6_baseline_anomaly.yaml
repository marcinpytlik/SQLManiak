        name: 'MSSQL: Some blocking is occurring for 5m'
        priority: AVERAGE
        description: Values greater than zero indicate at least some blocking is occurring, while a value of zero can quickly eliminate blocking as a potential root-cause
          problem.
        tags:
        - tag: scope
          value: performance
        status: DISABLED
      - uuid: e6a9f13a7fa942d3bbbb9ae721287aac
