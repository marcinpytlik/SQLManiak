    - uuid: cada4fb000cb4ed78879d4545f593822
      name: Quorum discovery
      type: DEPENDENT
      key: mssql.quorum.discovery
      filter:
        evaltype: AND
        conditions:
        - macro: '{#CLUSTER_NAME}'
          value: ^.+$
      description: Discovery of the quorum of the WSFC cluster.
      item_prototypes:
      - uuid: fd20fb2fd2c64453b179d152687373b3
        name: 'MSSQL Cluster ''{#CLUSTER_NAME}'': Quorum state'
        type: DEPENDENT
        key: mssql.quorum.state.[{#CLUSTER_NAME}]
        description: 'State of the WSFC quorum, one of:

          0 = Unknown quorum state

          1 = Normal quorum

          2 = Forced quorum

          '
        valuemap:
          name: MSSQL Quorum state
        preprocessing:
        - type: JSONPATH
          parameters:
          - $[?(@.cluster_name=='{#CLUSTER_NAME}')].quorum_state.first()
        - type: DISCARD_UNCHANGED_HEARTBEAT
          parameters:
          - 1h
        master_item:
          key: mssql.quorum.get["{$MSSQL.URI}","{$MSSQL.USER}","{$MSSQL.PASSWORD}"]
        tags:
        - tag: cluster-name
          value: '{#CLUSTER_NAME}'
        - tag: component
          value: quorum
      - uuid: e0fe46ababb048da98587e2e07ea0823
        name: 'MSSQL Cluster ''{#CLUSTER_NAME}'': Quorum type'
        type: DEPENDENT
        key: mssql.quorum.type.[{#CLUSTER_NAME}]
        description: 'Type of quorum used by this WSFC cluster, one of:

          0 = Node Majority. This quorum configuration can sustain failures of half the nodes (rounding up) minus one.

          1 = Node and Disk Majority. If the disk witness remains on line, this quorum configuration can sustain failures of half the nodes (rounding up).

          2 = Node and File Share Majority. This quorum configuration works in a similar way to Node and Disk Majority, but uses a file-share witness instead of a
          disk witness.

          3 = No Majority: Disk Only. If the quorum disk is online, this quorum configuration can sustain failures of all nodes except one.

          4 = Unknown Quorum. Unknown quorum for the cluster.

          5 = Cloud Witness. Cluster utilizes Microsoft Azure for quorum arbitration. If the cloud witness is available, the cluster can sustain the failure of half
          the nodes (rounding up).

          '
        valuemap:
          name: MSSQL Quorum type
        preprocessing:
        - type: JSONPATH
          parameters:
          - $[?(@.cluster_name=='{#CLUSTER_NAME}')].quorum_type.first()
        - type: DISCARD_UNCHANGED_HEARTBEAT
          parameters:
          - 1d
        master_item:
          key: mssql.quorum.get["{$MSSQL.URI}","{$MSSQL.USER}","{$MSSQL.PASSWORD}"]
        tags:
        - tag: cluster-name
          value: '{#CLUSTER_NAME}'
        - tag: component
          value: quorum
      master_item:
        key: mssql.quorum.get["{$MSSQL.URI}","{$MSSQL.USER}","{$MSSQL.PASSWORD}"]
      lld_macro_paths:
      - lld_macro: '{#CLUSTER_NAME}'
        path: $.cluster_name
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1d
    - uuid: c0fa3ad0a7fb41c189b274bf882ffaf6
