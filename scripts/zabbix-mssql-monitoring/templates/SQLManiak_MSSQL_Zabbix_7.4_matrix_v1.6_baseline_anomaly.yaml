zabbix_export:
  version: '7.4'
  template_groups:
  - uuid: 748ad4d098d447d492bb935c907f652f
    name: Templates/Databases
  templates:
  - uuid: b785ec3e74ec457e9578587d3e412b54
    template: SQLManiak MSSQL by Zabbix agent 2
    name: SQLManiak MSSQL by Zabbix agent 2
    description: "This template is designed for the effortless deployment of MSSQL monitoring by Zabbix via Zabbix agent 2 and uses a loadable plugin to run SQL queries.\n\
      \nSetup:\n\n1. Deploy Zabbix agent 2 with the MSSQL plugin. You can use this template starting with version 7.4.0 of both Zabbix and the MSSQL plugin.\n\n \
      \ For more information, see MSSQL plugin documentation: https://git.zabbix.com/projects/AP/repos/mssql/browse\n\n  Important! Starting with version 7.4-1 of\
      \ this template, the MSSQL plugin must be updated to a version equal to or above 7.4.0. (You can check the version of the template in its YAML file under the\
      \ \"vendor\" section.)\n\n  Loadable plugin requires installation of one of the following:\n\n  - Separate package\n  \n  - Binary file\n  \n  - Compilation\
      \ from sources: https://www.zabbix.com/documentation/7.4/manual/extensions/plugins/build\n\n2. Create an MSSQL user for monitoring.\n\n  View Server State and\
      \ View Any Definition permissions should be granted to the user.\n  Grant this user read permissions to the sysjobschedules, sysjobhistory, and sysjobs tables.\n\
      \n  For more information, see MSSQL documentation:\n  \n  - Create a database user: https://docs.microsoft.com/en-us/sql/relational-databases/security/authentication-access/create-a-database-user?view=sql-server-ver16\n\
      \  \n  - GRANT Server Permissions: https://docs.microsoft.com/en-us/sql/t-sql/statements/grant-server-permissions-transact-sql?view=sql-server-ver16\n  \n \
      \ - Configure a User to Create and Manage SQL Server Agent Jobs: https://docs.microsoft.com/en-us/sql/ssms/agent/configure-a-user-to-create-and-manage-sql-server-agent-jobs?view=sql-server-ver16\n\
      \n3. Set the user name and password in the host macros ({$MSSQL.USER} and {$MSSQL.PASSWORD}).\n\n4. Set the connection string for the MSSQL instance in the\
      \ {$MSSQL.URI} macro as a URI, such as <protocol://host:port>, or specify the named session - <sessionname>.\n\nThe \"Service's TCP port state\" item uses the\
      \ {$MSSQL.HOST} and {$MSSQL.PORT} macros to check the availability of the MSSQL instance, change these if necessary. Keep in mind that if dynamic ports are\
      \ used on the MSSQL server side, this check will not work correctly.\n\nNote: You can use the context macros {$MSSQL.BACKUP_FULL.USED}, {$MSSQL.BACKUP_LOG.USED},\
      \ and {$MSSQL.BACKUP_DIFF.USED} to disable backup age triggers for a certain database. If set to a value other than \"1\", the trigger expression for the backup\
      \ age will not fire.\n\nNote: Since version 7.2.0, you can also connect to the MSSQL instance using its name. To do this, set the connection string in the {$MSSQL.URI}\
      \ macro as <protocol://host/instance_name>.\n\nGenerated by official Zabbix template tool \"Templator\"\n\nSQLManiak matrix profile:\n- P1: availability/data\
      \ protection (TCP, monitoring channel, restart, DB state, backup SLA, SQL Agent failures/missed runs)\n- P2: selected critical performance alerts using metrics\
      \ already present in this template (memory pressure, blocking, deadlocks)\n- Noisy static diagnostic triggers are disabled where the monitoring matrix classifies\
      \ the metric as TREND rather than ALERT.\n- Metrics requiring new custom SQL collectors (relative CPU, scheduler pressure, I/O stall, long transactions, log\
      \ TTL, per-DB CPU, filegroups) are intentionally not fabricated here and remain a next implementation stage.\n\nSQLManiak custom collector pack v1.2:\n- Adds\
      \ custom-query collectors for CPU/scheduler pressure, SOS_SCHEDULER_YIELD, I/O latency, active transaction age,\n  CPU per database, ROWS allocation, filegroups\
      \ and TDE.\n- Adds calculated SQL Relative CPU, per-DB CPU capacity/share and predictive log time-to-full.\n- Alert thresholds for these newly added metrics\
      \ are intentionally not enabled in v1.2; collect baseline first.\n- Requires MSSQL Agent 2 custom queries to be enabled and the supplied .sql files copied to\
      \ CustomQueriesDir.\n\nSQLManiak v1.3:\n- Database discovery master refresh reduced to 5m so per-database CPU/space/TDE prototypes are instantiated promptly\
      \ after import.\n- Custom per-database JSONPath prototypes return 0 rather than becoming unsupported when a database is absent from a raw collector result.\n\
      - TDE encryption-state value mapping added.\n- TDE raw collector interval set to 15m for rollout visibility.\n\nSQLManiak v1.4:\n- Added VLF collector compatible\
      \ with SQL Server 2016 SP2+ using sys.dm_db_log_info().\n- Added per-database VLF count and instance maximum VLF count.\n- Added predictive ROWS allocated-space\
      \ time-to-full using Zabbix timeleft() over 6h history.\n- No new VLF/data-TTL alert thresholds are enabled in this version; threshold tuning remains a later\
      \ step.\n\nSQLManiak v1.5:\n- Added server/proxy-side E2E SQL probe using an External check.\n- Measures full round trip from Zabbix server/proxy through Agent\
      \ 2 + MSSQL plugin to SQL Server and back.\n- Stores E2E connectivity status, response time in ms, zabbix_get return code, and SQL UTC timestamp.\n- No E2E\
      \ latency thresholds are enabled yet; baseline first, thresholds later.\n\nSQLManiak v1.6:\n- Added E2E rolling baseline: 1h average, 24h average, 24h MAD.\n\
      - Added E2E anomaly indicators: robust 24h anomaly score and current/baseline ratio.\n- Added native Zabbix seasonal baselinewma and baselinedev metrics for\
      \ the same hour-of-day across 7 previous days.\n- No anomaly/latency triggers are enabled yet; collect baseline first and set thresholds later.\n- Database\
      \ discovery unchanged-heartbeat normalized to 5m.\n"
    readme: "## Setup\n\n1. Create a monitoring user on MSSQL for Zabbix to connect to:\n    - for MSSQL Server 2022\n    ```sql\n    CREATE LOGIN zabbix WITH PASSWORD\
      \ = 'password'\n    GRANT VIEW SERVER PERFORMANCE STATE TO zabbix\n    GRANT VIEW ANY DEFINITION TO zabbix\n    USE msdb\n    CREATE USER zabbix FOR LOGIN zabbix\n\
      \    GRANT EXECUTE ON msdb.dbo.agent_datetime TO zabbix\n    GRANT SELECT ON msdb.dbo.sysjobactivity TO zabbix\n    GRANT SELECT ON msdb.dbo.sysjobservers TO\
      \ zabbix\n    GRANT SELECT ON msdb.dbo.sysjobs TO zabbix\n    GO\n    ```\n    - for MSSQL versions 2017 and 2019\n    ```sql\n    CREATE LOGIN zabbix WITH\
      \ PASSWORD = 'password'\n    GRANT VIEW SERVER STATE TO zabbix\n    GRANT VIEW ANY DEFINITION TO zabbix\n    USE msdb\n    CREATE USER zabbix FOR LOGIN zabbix\n\
      \    GRANT EXECUTE ON msdb.dbo.agent_datetime TO zabbix\n    GRANT SELECT ON msdb.dbo.sysjobactivity TO zabbix\n    GRANT SELECT ON msdb.dbo.sysjobservers TO\
      \ zabbix\n    GRANT SELECT ON msdb.dbo.sysjobs TO zabbix\n    GO\n    ```\n\n    To allow Zabbix to query SQL Server Agent job information, a dedicated login\
      \ must be created and granted the required permissions through T-SQL:\n        - **VIEW SERVER STATE** is required for Microsoft SQL Server 2017 and 2019\n\
      \        - **VIEW SERVER PERFORMANCE STATE** is required for Microsoft SQL Server 2022\n        - **VIEW ANY DEFINITION** allows access to object definitions\
      \ and metadata\n        - **SELECT** allows the user to read data from the sysjobschedules, sysjobhistory, and sysjobs tables in the msdb database  \n    \n\
      \    \n    For more information, see MSSQL documentation:\n        - [Create a database user](https://docs.microsoft.com/en-us/sql/relational-databases/security/authentication-access/create-a-database-user?view=sql-server-ver16)\n\
      \        - [GRANT Server Permissions](https://docs.microsoft.com/en-us/sql/t-sql/statements/grant-server-permissions-transact-sql?view=sql-server-ver16)\n \
      \       - [Configure a User to Create and Manage SQL Server Agent Jobs](https://docs.microsoft.com/en-us/sql/ssms/agent/configure-a-user-to-create-and-manage-sql-server-agent-jobs?view=sql-server-ver16)\n\
      \n2. Set the username and password in the `MSSQL user` and `MSSQL password` host wizard configuration fields.  \n3. Set the connection string for the MSSQL\
      \ instance in the `MSSQL URI` host wizard configuration field as a URI, such as `<protocol://host:port>`, or specify the named session - `<sessionname>`.\n\n\
      \    The `Service's TCP port state` item uses the `MSSQL address` and `MSSQL TCP port` host wizard configuration fields to check the availability of the MSSQL\
      \ instance, change these if necessary. Keep in mind that if dynamic ports are used on the MSSQL server side, this check will not work correctly.\n    \n   \
      \ Additional notes:\n    - You can use the `Monitoring of full backup`, `Monitoring of log backup`, and `Monitoring of differential backup` host wizard configuration\
      \ fields to disable backup age triggers. If set to unselected state, the trigger expression for the backup age will not fire.\n    - Since version 7.2.0, you\
      \ can also connect to the MSSQL instance using its name. To do this, set the connection string in the `MSSQL URI` host wizard configuration field as `<protocol://host/instance_name>`.\n"
    groups:
    - name: Templates/Databases
    items:
    - uuid: ec06215f6f304d26b242e22119183261
      name: Get Access Methods counters
      type: DEPENDENT
      key: mssql.access_methods.raw
      history: '0'
      value_type: TEXT
      description: The item gets server information about access methods.
      preprocessing:
      - type: JSONPATH
        parameters:
        - $[?(@.object_name=~'.*Access Methods')]
        error_handler: DISCARD_VALUE
      master_item:
        key: mssql.perfcounter.get["{$MSSQL.URI}","{$MSSQL.USER}","{$MSSQL.PASSWORD}"]
      tags:
      - tag: component
        value: raw
    - uuid: bf7d33f513f04275abf6125cec5db74a
      name: Auto-param attempts per second
      type: DEPENDENT
      key: mssql.autoparam_attempts_sec.rate
      value_type: FLOAT
      description: Number of auto-parameterization attempts per second. The total should be the sum of the failed, safe, and unsafe auto-parameterizations. Auto-parameterization
        occurs when an instance of SQL Server tries to parameterize a Transact-SQL request by replacing some literals with parameters so that reuse of the resulting
        cached execution plan across multiple similar-looking requests is possible. Note that auto-parameterizations are also known as simple parameterizations in
        the newer versions of SQL Server. This counter does not include forced parameterizations.
      preprocessing:
      - type: JSONPATH
        parameters:
        - $[?(@.counter_name=='Auto-Param Attempts/sec')].cntr_value.first()
      - type: CHANGE_PER_SECOND
      master_item:
        key: mssql.sql_statistics.raw
      tags:
      - tag: component
        value: performance
    - uuid: 1903ddd1898644f8afd32b818b8a886c
      name: Get availability groups
      key: mssql.availability.group.get["{$MSSQL.URI}","{$MSSQL.USER}","{$MSSQL.PASSWORD}"]
      history: '0'
      value_type: TEXT
      description: The item gets availability group states - name, primary and secondary health, synchronization health.
      timeout: 30s
      tags:
      - tag: component
        value: raw
    - uuid: 44e662444cf548fcb53d897132f2b796
      name: Average latch wait time
      type: CALCULATED
      key: mssql.average_latch_wait_time
      delay: 0;m0-59s3
      value_type: FLOAT
      units: ms
      params: '(last(//mssql.average_latch_wait_time_raw) - last(//mssql.average_latch_wait_time_raw,#2)) /

        (last(//mssql.average_latch_wait_time_base) - last(//mssql.average_latch_wait_time_base,#2) +

        (last(//mssql.average_latch_wait_time_base) - last(//mssql.average_latch_wait_time_base,#2)=0))

        '
      description: Average latch wait time (in milliseconds) for latch requests that had to wait.
      tags:
      - tag: component
        value: wait-time
    - uuid: ab6635e466fe444dbf3dcc7b10b3a27d
      name: Average latch wait time base
      type: DEPENDENT
      key: mssql.average_latch_wait_time_base
      description: For internal use only.
      preprocessing:
      - type: JSONPATH
        parameters:
        - $[?(@.counter_name=='Average Latch Wait Time Base')].cntr_value.first()
      master_item:
        key: mssql.latches_info.raw
      tags:
      - tag: component
        value: wait-time
    - uuid: af9c3b91499348218c999f710d4387d4
      name: Average latch wait time raw
      type: DEPENDENT
      key: mssql.average_latch_wait_time_raw
      units: ms
      description: Average latch wait time (in milliseconds) for latch requests that had to wait.
      preprocessing:
      - type: JSONPATH
        parameters:
        - $[?(@.counter_name=='Average Latch Wait Time (ms)')].cntr_value.first()
      master_item:
        key: mssql.latches_info.raw
      tags:
      - tag: component
        value: wait-time
    - uuid: d2e4ac214c67450b8314de19f0a9521b
      name: Total average wait time
      type: CALCULATED
      key: mssql.average_wait_time
      delay: 0;m0-59s3
      value_type: FLOAT
      units: ms
      params: '(last(//mssql.average_wait_time_raw) - last(//mssql.average_wait_time_raw,#2)) /

        (last(//mssql.average_wait_time_base) - last(//mssql.average_wait_time_base,#2) +

        (last(//mssql.average_wait_time_base) - last(//mssql.average_wait_time_base,#2)=0))

        '
      description: The average wait time, in milliseconds, for each lock request that had to wait.
      tags:
      - tag: component
        value: wait-time
      triggers:
      - uuid: f02ba252aa7b4c50bb0ba98d2a919eb3
        expression: min(/SQLManiak MSSQL by Zabbix agent 2/mssql.average_wait_time,5m)>{$MSSQL.AVERAGE_WAIT_TIME.MAX}
        name: 'MSSQL: Total average wait time for locks is high'
        event_name: 'MSSQL: Total average wait time for locks is high (over {$MSSQL.AVERAGE_WAIT_TIME.MAX}ms for 5m)'
        priority: WARNING
        description: An average wait time longer than 500 ms may indicate excessive blocking. This value should generally correlate to "Lock Waits/sec" and move up
          or down with it accordingly.
        tags:
        - tag: scope
          value: performance
        status: DISABLED
    - uuid: 380c3fb4d0434547826380914ad9d8f5
      name: Total average wait time base
      type: DEPENDENT
      key: mssql.average_wait_time_base
      description: For internal use only.
      preprocessing:
      - type: JSONPATH
        parameters:
        - $[?(@.counter_name=='Average Wait Time Base')].cntr_value.first()
      master_item:
        key: mssql.locks_info.raw
      tags:
      - tag: component
        value: wait-time
    - uuid: 5e1efecbb2384fefb069e2505854e015
      name: Total average wait time raw
      type: DEPENDENT
      key: mssql.average_wait_time_raw
      units: ms
      description: Average amount of wait time (in milliseconds) for each lock request that resulted in a wait. Information for all locks.
      preprocessing:
      - type: JSONPATH
        parameters:
        - $[?(@.counter_name=='Average Wait Time (ms)')].cntr_value.first()
      master_item:
        key: mssql.locks_info.raw
      tags:
      - tag: component
        value: wait-time
    - uuid: d9c0767c14f64020ad86ebcf86e528d1
      name: Batch requests per second
      type: DEPENDENT
      key: mssql.batch_requests_sec.rate
      value_type: FLOAT
      units: rps
      description: Number of Transact-SQL command batches received per second. This statistic is affected by all constraints (such as I/O, number of users, cache
        size, complexity of requests, and so on). High batch requests mean good throughput.
      preprocessing:
      - type: JSONPATH
        parameters:
        - $[?(@.counter_name=='Batch Requests/sec')].cntr_value.first()
      - type: CHANGE_PER_SECOND
      master_item:
        key: mssql.sql_statistics.raw
      tags:
      - tag: component
        value: performance
    - uuid: 7843a1c4fddb44339689c64d09ee8612
      name: Buffer cache hit ratio
      type: DEPENDENT
      key: mssql.buffer_cache_hit_ratio
      value_type: FLOAT
      units: '%'
      description: Indicates the percentage of pages found in the buffer cache without having to read from the disk. The ratio is the total number of cache hits divided
        by the total number of cache lookups over the last few thousand page accesses. After a long period of time, the ratio changes very little. Since reading from
        the cache is much less expensive than reading from the disk, a higher value is preferred for this item. To increase the buffer cache hit ratio, consider increasing
        the amount of memory available to MSSQL Server or using the buffer pool extension feature.
      preprocessing:
      - type: JSONPATH
        parameters:
        - $[?(@.counter_name=='BufferCacheHitRatio')].cntr_value.first()
      master_item:
        key: mssql.buffer_manager.raw
      tags:
      - tag: component
        value: cache
      triggers:
      - uuid: c5cdd69e62634357b24f1a4e03511499
        expression: max(/SQLManiak MSSQL by Zabbix agent 2/mssql.buffer_cache_hit_ratio,5m)<{$MSSQL.BUFFER_CACHE_RATIO.MIN.CRIT}
        name: 'MSSQL: Percentage of the buffer cache efficiency is low'
        event_name: 'MSSQL: Percentage of the buffer cache efficiency is low (below {$MSSQL.BUFFER_CACHE_RATIO.MIN.CRIT}% for 5m)'
        priority: HIGH
        description: Too low buffer cache hit ratio.
        tags:
        - tag: scope
          value: performance
        status: DISABLED
      - uuid: a1bfa002a60a45c282ba6d5d66828e82
        expression: max(/SQLManiak MSSQL by Zabbix agent 2/mssql.buffer_cache_hit_ratio,5m)<{$MSSQL.BUFFER_CACHE_RATIO.MIN.WARN}
        name: 'MSSQL: Percentage of the buffer cache efficiency is low'
        event_name: 'MSSQL: Percentage of the buffer cache efficiency is low (below {$MSSQL.BUFFER_CACHE_RATIO.MIN.WARN}% for 5m)'
        priority: WARNING
        description: Low buffer cache hit ratio.
        dependencies:
        - name: 'MSSQL: Percentage of the buffer cache efficiency is low'
          expression: max(/SQLManiak MSSQL by Zabbix agent 2/mssql.buffer_cache_hit_ratio,5m)<{$MSSQL.BUFFER_CACHE_RATIO.MIN.CRIT}
        tags:
        - tag: scope
          value: performance
        status: DISABLED
    - uuid: ec7d7d76e8d043f6a6fbc36068009bd3
      name: Get Buffer Manager counters
      type: DEPENDENT
      key: mssql.buffer_manager.raw
      history: '0'
      value_type: TEXT
      description: The item gets server information about the buffer pool.
      preprocessing:
      - type: JSONPATH
        parameters:
        - $[?(@.object_name=~'.*Buffer Manager')]
        error_handler: DISCARD_VALUE
      master_item:
        key: mssql.perfcounter.get["{$MSSQL.URI}","{$MSSQL.USER}","{$MSSQL.PASSWORD}"]
      tags:
      - tag: component
        value: raw
    - uuid: e917e1cc1bf349f1aba6a78cb29a148f
      name: Cache hit ratio
      type: DEPENDENT
      key: mssql.cache_hit_ratio
      value_type: FLOAT
      units: '%'
      description: Ratio between cache hits and lookups.
      preprocessing:
      - type: JSONPATH
        parameters:
        - $[?(@.counter_name=='CacheHitRatio')].cntr_value.first()
      master_item:
        key: mssql.cache_info.raw
      tags:
      - tag: component
        value: cache
    - uuid: e6a01e43edcb470a9da20e1c8afdeb69
      name: Get Cache counters
      type: DEPENDENT
      key: mssql.cache_info.raw
      history: '0'
      value_type: TEXT
      description: The item gets server information about cache.
      preprocessing:
      - type: JSONPATH
        parameters:
        - $[?(@.object_name=~'.*Plan Cache' && @.instance_name=='_Total')]
        error_handler: DISCARD_VALUE
      master_item:
        key: mssql.perfcounter.get["{$MSSQL.URI}","{$MSSQL.USER}","{$MSSQL.PASSWORD}"]
      tags:
      - tag: component
        value: raw
    - uuid: cb468f1bb2944babbd40f5bb281f59e9
      name: Cache objects in use
      type: DEPENDENT
      key: mssql.cache_objects_in_use
      description: Number of cache objects in use.
      preprocessing:
      - type: JSONPATH
        parameters:
        - $[?(@.counter_name=='Cache Objects in use')].cntr_value.first()
      master_item:
        key: mssql.cache_info.raw
      tags:
      - tag: component
        value: cache
    - uuid: 8ad030dbb22b44ee8d491eabc77f126a
      name: Cache object counts
      type: DEPENDENT
      key: mssql.cache_object_counts
      description: Number of cache objects in the cache.
      preprocessing:
      - type: JSONPATH
        parameters:
        - $[?(@.counter_name=='Cache Object Counts')].cntr_value.first()
      master_item:
        key: mssql.cache_info.raw
      tags:
      - tag: component
        value: cache
    - uuid: f1816fc692e44e5cb467343c21f02206
      name: Cache pages
      type: DEPENDENT
      key: mssql.cache_pages
      description: Number of 8-kilobyte (KB) pages used by cache objects.
      preprocessing:
      - type: JSONPATH
        parameters:
        - $[?(@.counter_name=='Cache Pages')].cntr_value.first()
      master_item:
        key: mssql.cache_info.raw
      tags:
      - tag: component
        value: cache
      - tag: component
        value: page
    - uuid: d88d7473f9a24f9b94f5c1d0bcc8dbdc
      name: Checkpoint pages per second
      type: DEPENDENT
      key: mssql.checkpoint_pages_sec.rate
      value_type: FLOAT
      description: Indicates the number of pages flushed to the disk per second by a checkpoint or other operation which required all dirty pages to be flushed.
      preprocessing:
      - type: JSONPATH
        parameters:
        - $[?(@.counter_name=='Checkpoint pages/sec')].cntr_value.first()
      - type: CHANGE_PER_SECOND
      master_item:
        key: mssql.buffer_manager.raw
      tags:
      - tag: component
        value: page
      - tag: component
        value: performance
    - uuid: ea0aab66207049b3b7470021a205bb5e
      name: Database pages
      type: DEPENDENT
      key: mssql.database_pages
      description: Indicates the number of pages in the buffer pool with database content.
      preprocessing:
      - type: JSONPATH
        parameters:
        - $[?(@.counter_name=='Database pages')].cntr_value.first()
      master_item:
        key: mssql.buffer_manager.raw
      tags:
      - tag: component
        value: page
    - uuid: 1f97efa1940e4fc3b1bc2de5746ff22a
      name: Total data file size
      type: DEPENDENT
      key: mssql.data_files_size
      units: B
      description: Total size of all data files.
      preprocessing:
      - type: JSONPATH
        parameters:
        - $[?(@.counter_name=='Data File(s) Size (KB)')].cntr_value.first()
      - type: MULTIPLIER
        parameters:
        - '1024'
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1h
      master_item:
        key: mssql.db_info.raw
      tags:
      - tag: component
        value: application
    - uuid: 06ce96462a9647da898e1ba9e3da9fe4
      name: Get database
      key: mssql.db.get["{$MSSQL.URI}","{$MSSQL.USER}","{$MSSQL.PASSWORD}"]
      delay: 5m
      history: '0'
      value_type: TEXT
      description: Getting databases - database name and recovery model.
      timeout: 30s
      tags:
      - tag: component
        value: raw
    - uuid: c036d14446b94da49475945fa603241c
      name: Get DB counters
      type: DEPENDENT
      key: mssql.db_info.raw
