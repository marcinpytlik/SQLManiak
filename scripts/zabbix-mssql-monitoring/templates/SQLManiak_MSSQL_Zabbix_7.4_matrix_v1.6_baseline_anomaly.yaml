        name: 'MSSQL: TCP connection time is high'
        event_name: 'MSSQL: TCP connection time is high (> {$MSSQL.TCP.CRIT}s for 5m)'
        priority: HIGH
        tags:
        - tag: component
          value: availability
        - tag: service
          value: mssql
        - tag: scope
          value: instance
        - tag: priority
          value: P1
      - uuid: 6dccc670027c476bbc93c514bf075e29
        expression: avg(/SQLManiak MSSQL by Zabbix agent 2/net.tcp.service.perf[tcp,{$MSSQL.HOST},{$MSSQL.PORT}],5m)>{$MSSQL.TCP.WARN} and avg(/SQLManiak MSSQL by
          Zabbix agent 2/net.tcp.service.perf[tcp,{$MSSQL.HOST},{$MSSQL.PORT}],5m)<={$MSSQL.TCP.CRIT}
        name: 'MSSQL: TCP connection time is elevated'
        event_name: 'MSSQL: TCP connection time is elevated (> {$MSSQL.TCP.WARN}s for 5m)'
        priority: WARNING
        tags:
        - tag: component
          value: availability
        - tag: service
          value: mssql
        - tag: scope
          value: instance
        - tag: priority
          value: P1
