      - uuid: 9a5a8852f11a4558928c95bfe799a1ed
        name: 'MSSQL DB ''{#DBNAME}'' FG ''{#FILEGROUP}'': free size'
        type: DEPENDENT
        key: mssql.db.filegroup.free_mb["{#DBNAME}","{#FILEGROUP}"]
        description: Internal allocated/used filegroup space. Free MB is allocated-but-unused space, not filesystem free space.
        preprocessing:
        - type: JSONPATH
          parameters:
          - $[?(@.db=='{#DBNAME}' && @.filegroup=='{#FILEGROUP}')].free_mb.first()
        master_item:
          key: mssql.custom.query["{$MSSQL.URI}","{$MSSQL.USER}","{$MSSQL.PASSWORD}",sqlmaniak_filegroups]
        tags:
        - tag: component
