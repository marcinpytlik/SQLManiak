      value_type: FLOAT
      units: '%'
      description: Percentage of work tables created where the initial two pages of the work table were not allocated but were immediately available from the work
        table cache.
      preprocessing:
      - type: JSONPATH
        parameters:
        - $[?(@.counter_name=='WorktablesFromCacheRatio')].cntr_value.first()
