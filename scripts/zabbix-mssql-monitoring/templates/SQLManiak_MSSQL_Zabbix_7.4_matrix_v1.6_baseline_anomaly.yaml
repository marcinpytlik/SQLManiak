      valuemap:
        name: Service state
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 10m
      tags:
      - tag: component
        value: network
      triggers:
      - uuid: 00a04c1227974ca7b344fd647bd182e0
        expression: last(/SQLManiak MSSQL by Zabbix agent 2/net.tcp.service[tcp,{$MSSQL.HOST},{$MSSQL.PORT}])=0
        name: 'MSSQL: Service is unavailable'
        status: DISABLED
        priority: DISASTER
        description: The TCP port of the MSSQL Server service is currently unavailable.
        tags:
        - tag: scope
          value: availability
      - uuid: 1e4c12d842f240ca9961667b8a554f43
        expression: max(/SQLManiak MSSQL by Zabbix agent 2/net.tcp.service[tcp,{$MSSQL.HOST},{$MSSQL.PORT}],{$MSSQL.TCP.FAIL.COUNT})=0
        recovery_mode: RECOVERY_EXPRESSION
        recovery_expression: min(/SQLManiak MSSQL by Zabbix agent 2/net.tcp.service[tcp,{$MSSQL.HOST},{$MSSQL.PORT}],{$MSSQL.TCP.RECOVERY.COUNT})=1
        name: 'MSSQL: TCP port unavailable'
        priority: DISASTER
        tags:
        - tag: component
          value: availability
        - tag: service
          value: mssql
        - tag: scope
          value: instance
        - tag: priority
          value: P1
        description: P1 root-cause availability alert. Suppress during planned patching/failover with maintenance.
    - uuid: c0bf1a6d66ae49feaa4be62176a7d838
      name: TCP connection time
      type: SIMPLE
      key: net.tcp.service.perf[tcp,{$MSSQL.HOST},{$MSSQL.PORT}]
      delay: 2m
      value_type: FLOAT
      units: s
