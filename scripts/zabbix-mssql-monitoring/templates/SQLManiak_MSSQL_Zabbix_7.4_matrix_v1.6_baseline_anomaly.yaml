        - tag: quorum-members-name
          value: '{#MEMBER_NAME}'
      - uuid: 3f5029510fc144fe928626fd3cfd89a2
        name: 'MSSQL Cluster member ''{#MEMBER_NAME}'': Member type'
        type: DEPENDENT
        key: mssql.quorum_members.member_type.[{#MEMBER_NAME}]
        description: 'The type of member, one of:

          0 = WSFC node

          1 = Disk witness

          2 = File share witness

          3 = Cloud Witness

          '
        valuemap:
          name: MSSQL Quorum members type
        preprocessing:
        - type: JSONPATH
          parameters:
