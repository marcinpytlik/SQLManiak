      value_type: FLOAT
      description: Number of SQL compilations per second. Indicates the number of times the compile code path is entered. Includes runs caused by statement-level
        recompilations in SQL Server. After SQL Server user activity is stable, this value reaches a steady state.
      preprocessing:
      - type: JSONPATH
        parameters:
