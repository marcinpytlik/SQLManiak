  triggers:
  - uuid: ec39285cfab141cdaeaf30adb2f7ef21
    expression: 'nodata(/SQLManiak MSSQL by Zabbix agent 2/mssql.batch_requests_sec.rate,{$MSSQL.AGENT2.NODATA})=1

      and

      last(/SQLManiak MSSQL by Zabbix agent 2/net.tcp.service[tcp,{$MSSQL.HOST},{$MSSQL.PORT}])=1

      '
    name: 'MSSQL: Agent2/plugin is not returning data'
    priority: HIGH
    dependencies:
    - name: 'MSSQL: TCP port unavailable'
      expression: max(/SQLManiak MSSQL by Zabbix agent 2/net.tcp.service[tcp,{$MSSQL.HOST},{$MSSQL.PORT}],{$MSSQL.TCP.FAIL.COUNT})=0
      recovery_expression: min(/SQLManiak MSSQL by Zabbix agent 2/net.tcp.service[tcp,{$MSSQL.HOST},{$MSSQL.PORT}],{$MSSQL.TCP.RECOVERY.COUNT})=1
    tags:
    - tag: component
      value: monitoring
    - tag: priority
      value: P1
    - tag: scope
      value: instance
  - uuid: 56ded9bb035a4289934d45968a16e3f7
    expression: last(/SQLManiak MSSQL by Zabbix agent 2/mssql.forwarded_records_sec.rate) * 100 > 10 * last(/SQLManiak MSSQL by Zabbix agent 2/mssql.batch_requests_sec.rate)
    name: 'MSSQL: Too frequently using pointers'
    priority: WARNING
    description: Rows with VARCHAR columns can experience expansion when VARCHAR values are updated with a longer string. In the case where the row cannot fit in
      the existing page, the row migrates, and access to the row will traverse a pointer. This only happens on heaps (tables without clustered indexes). In cases
      where clustered indexes cannot be used, drop non-clustered indexes, build a clustered index to reorg pages and rows, drop the clustered index, then recreate
      non-clustered indexes.
    tags:
    - tag: scope
      value: performance
  - uuid: a6f5185d1eb4488cbd5b5334426c4625
    expression: last(/SQLManiak MSSQL by Zabbix agent 2/mssql.readahead_pages_sec.rate) > {$MSSQL.PERCENT_READAHEAD.MAX} / 100 * last(/SQLManiak MSSQL by Zabbix agent
      2/mssql.page_reads_sec.rate)
    name: 'MSSQL: Too many physical reads occurring'
    priority: WARNING
    description: If this value makes up even a sizeable minority of the total "Page Reads/sec" (say, greater than 20% of the total page reads), you may have too many
      physical reads occurring.
    tags:
    - tag: scope
      value: performance
