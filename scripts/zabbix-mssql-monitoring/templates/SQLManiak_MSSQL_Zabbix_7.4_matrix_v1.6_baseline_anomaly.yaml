        error_handler: DISCARD_VALUE
      master_item:
        key: mssql.perfcounter.get["{$MSSQL.URI}","{$MSSQL.USER}","{$MSSQL.PASSWORD}"]
      tags:
      - tag: component
        value: raw
    - uuid: 03f06fc3d91049f0bd27d37599140204
      name: Total errors per second
      type: DEPENDENT
      key: mssql.errors_sec.rate
