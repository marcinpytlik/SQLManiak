        name: 'MSSQL: Blocking correlated with lock pressure'
        priority: WARNING
        dependencies:
        - name: 'MSSQL: Blocking has measurable workload impact'
          expression: min(/SQLManiak MSSQL by Zabbix agent 2/mssql.processes_blocked,5m)>0 and (max(/SQLManiak MSSQL by Zabbix agent 2/mssql.lock_timeouts_sec.rate,5m)>0
            or avg(/SQLManiak MSSQL by Zabbix agent 2/mssql.average_wait_time,5m)>{$MSSQL.AVGWAIT.CRIT})
        description: P2 blocking is present and lock-wait pressure is elevated. Tune {$MSSQL.LOCKWAITS.WARN} per instance after baseline.
        tags:
        - tag: component
          value: locks
        - tag: symptom
          value: blocking
        - tag: priority
          value: P2
