          value: '{#MEMBER_NAME}'
      - uuid: 09331b1776224325a92485f29edeed57
        name: 'MSSQL Cluster member ''{#MEMBER_NAME}'': Number of quorum votes'
        type: DEPENDENT
        key: mssql.quorum_members.number_of_quorum_votes.[{#MEMBER_NAME}]
        description: Number of quorum votes possessed by this quorum member.
        preprocessing:
        - type: JSONPATH
          parameters:
          - $[?(@.member_name=='{#MEMBER_NAME}')].number_of_quorum_votes.first()
        - type: DISCARD_UNCHANGED_HEARTBEAT
          parameters:
          - 1d
        master_item:
          key: mssql.quorum.member.get["{$MSSQL.URI}","{$MSSQL.USER}","{$MSSQL.PASSWORD}"]
        tags:
        - tag: component
          value: quorum members
        - tag: quorum-members-name
          value: '{#MEMBER_NAME}'
      master_item:
        key: mssql.quorum.member.get["{$MSSQL.URI}","{$MSSQL.USER}","{$MSSQL.PASSWORD}"]
      lld_macro_paths:
      - lld_macro: '{#CLUSTER_NAME}'
        path: $.cluster_name
      - lld_macro: '{#MEMBER_NAME}'
        path: $.member_name
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1d
    - uuid: 5d88d404acaf4aa09773522e30e4945f
      name: Replication discovery
      type: DEPENDENT
      key: mssql.replica.discovery
      description: Discovery of the database replicas.
      item_prototypes:
      - uuid: 15c278cfe28f4857b65a7e5a70dae92b
        name: 'MSSQL AG ''{#GROUP_NAME}'' Replica ''{#REPLICA_NAME}'': Connected state'
        type: DEPENDENT
        key: mssql.replica.connected_state["{#GROUP_NAME}_{#REPLICA_NAME}"]
        description: 'Whether a secondary replica is currently connected to the primary replica:

          0 = Disconnected. The response of an availability replica to the "Disconnected" state depends on its role:

          On the primary replica, if a secondary replica is disconnected, its secondary databases are marked as "Not synchronized" on the primary replica, which waits
          for the secondary to reconnect;

          On a secondary replica, upon detecting that it is disconnected, the secondary replica attempts to reconnect to the primary replica.

          1 = Connected. Each primary replica tracks the connection state for every secondary replica in the same availability group. Secondary replicas track the
          connection state of only the primary replica.

          '
        valuemap:
          name: MSSQL AG Connected state
        preprocessing:
        - type: JSONPATH
          parameters:
          - $[?(@.replica_name=='{#REPLICA_NAME}' && @.group_name=='{#GROUP_NAME}')].connected_state.first()
        - type: DISCARD_UNCHANGED_HEARTBEAT
          parameters:
          - 1h
        master_item:
          key: mssql.replica.get["{$MSSQL.URI}","{$MSSQL.USER}","{$MSSQL.PASSWORD}"]
        tags:
        - tag: availability-group
          value: '{#GROUP_NAME}'
        - tag: component
          value: replica
        - tag: replica
          value: '{#REPLICA_NAME}'
      - uuid: 2dd315bb67aa44af92a96b8b9cc13990
        name: 'MSSQL AG ''{#GROUP_NAME}'' Replica ''{#REPLICA_NAME}'': Is local'
        type: DEPENDENT
        key: mssql.replica.is_local["{#GROUP_NAME}_{#REPLICA_NAME}"]
        description: 'Whether the replica is local:

          0 = Indicates a remote secondary replica in an availability group whose primary replica is hosted by the local server instance. This value occurs only on
          the primary replica location.

          1 = Indicates a local replica. On secondary replicas, this is the only available value for the availability group to which the replica belongs.

          '
        valuemap:
          name: MSSQL - Yes / No
        preprocessing:
        - type: JSONPATH
          parameters:
          - $[?(@.replica_name=='{#REPLICA_NAME}' && @.group_name=='{#GROUP_NAME}')].is_local.first()
        - type: DISCARD_UNCHANGED_HEARTBEAT
          parameters:
          - 1h
        master_item:
          key: mssql.replica.get["{$MSSQL.URI}","{$MSSQL.USER}","{$MSSQL.PASSWORD}"]
        tags:
        - tag: availability-group
          value: '{#GROUP_NAME}'
        - tag: component
          value: replica
        - tag: replica
          value: '{#REPLICA_NAME}'
      - uuid: 412ebf76fff242d7883bd367e7c0ac3a
        name: 'MSSQL AG ''{#GROUP_NAME}'' Replica ''{#REPLICA_NAME}'': Join state'
        type: DEPENDENT
        key: mssql.replica.join_state["{#GROUP_NAME}_{#REPLICA_NAME}"]
        description: '0 = Not joined

          1 = Joined, standalone instance

          2 = Joined, failover cluster instance

          '
        valuemap:
          name: MSSQL AG Join state
        preprocessing:
        - type: JSONPATH
          parameters:
          - $[?(@.replica_name=='{#REPLICA_NAME}' && @.group_name=='{#GROUP_NAME}')].join_state.first()
        - type: DISCARD_UNCHANGED_HEARTBEAT
          parameters:
          - 1h
        master_item:
          key: mssql.replica.get["{$MSSQL.URI}","{$MSSQL.USER}","{$MSSQL.PASSWORD}"]
        tags:
        - tag: availability-group
          value: '{#GROUP_NAME}'
        - tag: component
          value: replica
        - tag: replica
          value: '{#REPLICA_NAME}'
      - uuid: 8176d0fcce9845828a68f3aa3a92411b
        name: 'MSSQL AG ''{#GROUP_NAME}'' Replica ''{#REPLICA_NAME}'': Operational state'
        type: DEPENDENT
        key: mssql.replica.operational_state["{#GROUP_NAME}_{#REPLICA_NAME}"]
        description: 'Current operational state of the replica:

          0 = Pending failover

          1 = Pending

          2 = Online

          3 = Offline

          4 = Failed

          5 = Failed, no quorum

          6 = Not local

          '
        valuemap:
          name: MSSQL AG Operational state
        preprocessing:
        - type: JSONPATH
          parameters:
          - $[?(@.replica_name=='{#REPLICA_NAME}' && @.group_name=='{#GROUP_NAME}')].operational_state.first()
        - type: DISCARD_UNCHANGED_HEARTBEAT
          parameters:
          - 1h
        master_item:
          key: mssql.replica.get["{$MSSQL.URI}","{$MSSQL.USER}","{$MSSQL.PASSWORD}"]
        tags:
        - tag: availability-group
          value: '{#GROUP_NAME}'
        - tag: component
          value: replica
        - tag: replica
          value: '{#REPLICA_NAME}'
        trigger_prototypes:
        - uuid: aaa7a2cc80ab4978a3fdc8e4a614b201
          expression: last(/SQLManiak MSSQL by Zabbix agent 2/mssql.replica.operational_state["{#GROUP_NAME}_{#REPLICA_NAME}"])=0 or last(/SQLManiak MSSQL by Zabbix
            agent 2/mssql.replica.operational_state["{#GROUP_NAME}_{#REPLICA_NAME}"])=1 or last(/SQLManiak MSSQL by Zabbix agent 2/mssql.replica.operational_state["{#GROUP_NAME}_{#REPLICA_NAME}"])=3
          name: 'MSSQL: AG ''{#GROUP_NAME}'' Replica ''{#REPLICA_NAME}'': {#REPLICA_NAME} is {ITEM.VALUE}'
          priority: WARNING
          description: The operational state of the replica in a given availability group is "Pending" or "Offline".
          tags:
          - tag: availability-group
            value: '{#GROUP_NAME}'
          - tag: replica
            value: '{#REPLICA_NAME}'
          - tag: scope
            value: availability
        - uuid: 5dcfaa6d3c7a4a61aad9b039abdcf77b
          expression: last(/SQLManiak MSSQL by Zabbix agent 2/mssql.replica.operational_state["{#GROUP_NAME}_{#REPLICA_NAME}"])=4
          name: 'MSSQL: AG ''{#GROUP_NAME}'' Replica ''{#REPLICA_NAME}'': {#REPLICA_NAME} is {ITEM.VALUE}'
          priority: AVERAGE
          description: The operational state of the replica in a given availability group is "Failed".
          tags:
          - tag: availability-group
            value: '{#GROUP_NAME}'
          - tag: replica
            value: '{#REPLICA_NAME}'
          - tag: scope
            value: availability
        - uuid: 2f9fe38f0b8f46e4b8d5d3f82caab486
          expression: last(/SQLManiak MSSQL by Zabbix agent 2/mssql.replica.operational_state["{#GROUP_NAME}_{#REPLICA_NAME}"])=5
          name: 'MSSQL: AG ''{#GROUP_NAME}'' Replica ''{#REPLICA_NAME}'': {#REPLICA_NAME} is {ITEM.VALUE}'
          priority: HIGH
          description: The operational state of the replica in a given availability group is "Failed, no quorum".
          tags:
          - tag: availability-group
            value: '{#GROUP_NAME}'
          - tag: replica
            value: '{#REPLICA_NAME}'
          - tag: scope
            value: availability
      - uuid: 9210f69b31f3405fb4440d6515290577
        name: 'MSSQL AG ''{#GROUP_NAME}'' Replica ''{#REPLICA_NAME}'': Recovery health'
        type: DEPENDENT
        key: mssql.replica.recovery_health["{#GROUP_NAME}_{#REPLICA_NAME}"]
        description: 'Rollup of the "database_state" column of the `sys.dm_hadr_database_replica_states` dynamic management view:

          0 = In progress. At least one joined database has a database state other than "Online" (database_state is not "0").

          1 = Online. All the joined databases have a database state of "Online" (database_state is "0").

          '
        valuemap:
          name: MSSQL AG Recovery health
        preprocessing:
        - type: JSONPATH
          parameters:
          - $[?(@.replica_name=='{#REPLICA_NAME}' && @.group_name=='{#GROUP_NAME}')].recovery_health.first()
        - type: DISCARD_UNCHANGED_HEARTBEAT
          parameters:
          - 1h
        master_item:
          key: mssql.replica.get["{$MSSQL.URI}","{$MSSQL.USER}","{$MSSQL.PASSWORD}"]
        tags:
        - tag: availability-group
          value: '{#GROUP_NAME}'
        - tag: component
          value: replica
        - tag: replica
          value: '{#REPLICA_NAME}'
        trigger_prototypes:
        - uuid: eb70ce1a67e94541873f66dfe0ce8fc9
          expression: last(/SQLManiak MSSQL by Zabbix agent 2/mssql.replica.recovery_health["{#GROUP_NAME}_{#REPLICA_NAME}"])=0
          name: 'MSSQL: AG ''{#GROUP_NAME}'' Replica ''{#REPLICA_NAME}'': {#REPLICA_NAME} Recovery in progress'
          priority: INFO
          description: At least one joined database has a database state other than "Online".
          tags:
          - tag: availability-group
            value: '{#GROUP_NAME}'
          - tag: replica
            value: '{#REPLICA_NAME}'
          - tag: scope
            value: notice
      - uuid: 4955ad7da4e94d9297b826a0a1ea78df
        name: 'MSSQL AG ''{#GROUP_NAME}'' Replica ''{#REPLICA_NAME}'': Role'
        type: DEPENDENT
        key: mssql.replica.role["{#GROUP_NAME}_{#REPLICA_NAME}"]
        description: 'Current Always On availability group role of a local replica or a connected remote replica:

          0 = Resolving

          1 = Primary

          2 = Secondary

          '
        valuemap:
          name: MSSQL AG Role
        preprocessing:
        - type: JSONPATH
          parameters:
          - $[?(@.replica_name=='{#REPLICA_NAME}' && @.group_name=='{#GROUP_NAME}')].role.first()
        - type: DISCARD_UNCHANGED_HEARTBEAT
          parameters:
          - 1h
        master_item:
          key: mssql.replica.get["{$MSSQL.URI}","{$MSSQL.USER}","{$MSSQL.PASSWORD}"]
        tags:
        - tag: availability-group
          value: '{#GROUP_NAME}'
        - tag: component
          value: replica
        - tag: replica
          value: '{#REPLICA_NAME}'
      - uuid: 260d2b5a1e284d96b9c3ecc671365eab
        name: 'MSSQL AG ''{#GROUP_NAME}'' Replica ''{#REPLICA_NAME}'': Sync health'
        type: DEPENDENT
        key: mssql.replica.synchronization_health["{#GROUP_NAME}_{#REPLICA_NAME}"]
        description: 'Reflects a rollup of the database synchronization state (synchronization_state) of all joined availability databases (also known as replicas)
          and the availability mode of the replica (synchronous-commit or asynchronous-commit mode). The rollup will reflect the least healthy accumulated state of
          the databases on the replica:

          0 = Not healthy. At least one joined database is in the "Not synchronizing" state.

          1 = Partially healthy. Some replicas are not in the target synchronization state: synchronous-commit replicas should be synchronized, and asynchronous-commit
          replicas should be synchronizing.

          2 = Healthy. All replicas are in the target synchronization state: synchronous-commit replicas are synchronized, and asynchronous-commit replicas are synchronizing.

          '
        valuemap:
          name: MSSQL AG Synchronization health
        preprocessing:
        - type: JSONPATH
          parameters:
          - $[?(@.replica_name=='{#REPLICA_NAME}' && @.group_name=='{#GROUP_NAME}')].synchronization_health.first()
        - type: DISCARD_UNCHANGED_HEARTBEAT
          parameters:
          - 1h
        master_item:
          key: mssql.replica.get["{$MSSQL.URI}","{$MSSQL.USER}","{$MSSQL.PASSWORD}"]
        tags:
        - tag: availability-group
          value: '{#GROUP_NAME}'
        - tag: component
          value: replica
        - tag: replica
          value: '{#REPLICA_NAME}'
        trigger_prototypes:
        - uuid: 58ec4529f6b64e31947ef9b9dadb1aac
          expression: last(/SQLManiak MSSQL by Zabbix agent 2/mssql.replica.synchronization_health["{#GROUP_NAME}_{#REPLICA_NAME}"])=0
          name: 'MSSQL: AG ''{#GROUP_NAME}'' Replica ''{#REPLICA_NAME}'': {#REPLICA_NAME} is Not healthy'
          priority: AVERAGE
          description: At least one joined database is in the "Not synchronizing" state.
          tags:
          - tag: availability-group
            value: '{#GROUP_NAME}'
          - tag: replica
            value: '{#REPLICA_NAME}'
          - tag: scope
            value: availability
        - uuid: e57fc19e55ca496dbb88c176775670e7
          expression: last(/SQLManiak MSSQL by Zabbix agent 2/mssql.replica.synchronization_health["{#GROUP_NAME}_{#REPLICA_NAME}"])=1
          name: 'MSSQL: AG ''{#GROUP_NAME}'' Replica ''{#REPLICA_NAME}'': {#REPLICA_NAME} is Partially healthy'
          priority: WARNING
          description: 'Some replicas are not in the target synchronization state: synchronous-commit replicas should be synchronized, and asynchronous-commit replicas
            should be synchronizing.'
          tags:
          - tag: availability-group
            value: '{#GROUP_NAME}'
          - tag: replica
            value: '{#REPLICA_NAME}'
          - tag: scope
            value: availability
      trigger_prototypes:
      - uuid: 3f7aa1938e59428c98789edc518bb173
        expression: last(/SQLManiak MSSQL by Zabbix agent 2/mssql.replica.connected_state["{#GROUP_NAME}_{#REPLICA_NAME}"])=0 and last(/SQLManiak MSSQL by Zabbix
          agent 2/mssql.replica.role["{#GROUP_NAME}_{#REPLICA_NAME}"])=2
        name: 'MSSQL: AG ''{#GROUP_NAME}'' Replica ''{#REPLICA_NAME}'': {#REPLICA_NAME} is disconnected'
        priority: WARNING
        description: 'The response of an availability replica to the "Disconnected" state depends on its role:

          On the primary replica, if a secondary replica is disconnected, its secondary databases are marked as "Not synchronized" on the primary replica, which waits
          for the secondary to reconnect;

          On a secondary replica, upon detecting that it is disconnected, the secondary replica attempts to reconnect to the primary replica.

          '
        tags:
        - tag: availability-group
          value: '{#GROUP_NAME}'
        - tag: replica
          value: '{#REPLICA_NAME}'
        - tag: scope
          value: availability
      master_item:
        key: mssql.replica.get["{$MSSQL.URI}","{$MSSQL.USER}","{$MSSQL.PASSWORD}"]
      lld_macro_paths:
      - lld_macro: '{#GROUP_NAME}'
        path: $.group_name
      - lld_macro: '{#REPLICA_NAME}'
        path: $.replica_name
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1d
    - uuid: d449ee54a9ee417580c3a01a2b073b60
      name: MSSQL filegroup discovery
      type: DEPENDENT
      key: mssql.filegroup.discovery
      description: Discovers ROWS filegroups from the SQLManiak custom filegroups query.
      item_prototypes:
