    - uuid: 1e1c87320bfa4ab291886c930555f915
      name: Percent of ad hoc queries running
      type: CALCULATED
      key: mssql.percent_of_adhoc_queries
      delay: 0;m0-59s3
      value_type: FLOAT
      units: '%'
      params: 'last(//mssql.sql_compilations_sec.rate) * 100 /

        (last(//mssql.batch_requests_sec.rate) + (last(//mssql.batch_requests_sec.rate)=0))

        '
      description: The ratio of SQL compilations per second to batch requests per second, in percent.
      tags:
      - tag: component
        value: application
      triggers:
      - uuid: e9aff8b9e964474aaff29f558f3a3fb8
        expression: min(/SQLManiak MSSQL by Zabbix agent 2/mssql.percent_of_adhoc_queries,15m) > {$MSSQL.PERCENT_COMPILATIONS.MAX}
        name: 'MSSQL: Percent of ad hoc queries running is high'
        event_name: 'MSSQL: Percent of ad hoc queries running is over {$MSSQL.PERCENT_COMPILATIONS.MAX}% for 15m'
        priority: WARNING
        description: The lower this value is, the better. High values often indicate excessive ad hoc querying and should be as low as possible. If excessive ad hoc
          querying is happening, try rewriting the queries as procedures or invoke the queries using `sp_executeSQL`. When rewriting isn't possible, consider using
          a plan guide or setting the database to parameterization forced mode.
        tags:
        - tag: scope
          value: performance
        status: DISABLED
    - uuid: 42c2c944771c47c495b45c1ecfb36842
      name: Percent of Recompiled Transact-SQL Objects
      type: CALCULATED
      key: mssql.percent_recompilations_to_compilations
      delay: 0;m0-59s3
      value_type: FLOAT
      units: '%'
      params: 'last(//mssql.sql_recompilations_sec.rate) * 100 /

        (last(//mssql.sql_compilations_sec.rate) + (last(//mssql.sql_compilations_sec.rate)=0))

        '
      description: The ratio of SQL re-compilations per second to SQL compilations per second, in percent.
      tags:
      - tag: component
        value: application
      triggers:
      - uuid: d0fb76bdacc942219cb7fa33b583620f
        expression: min(/SQLManiak MSSQL by Zabbix agent 2/mssql.percent_recompilations_to_compilations,15m) > {$MSSQL.PERCENT_RECOMPILATIONS.MAX}
        name: 'MSSQL: Percent of times statement recompiles is high'
        event_name: 'MSSQL: Percent of times statement recompiles is over {$MSSQL.PERCENT_RECOMPILATIONS.MAX}% for 15m'
        priority: WARNING
        description: This number should be at or near zero, since recompiles can cause deadlocks and exclusive compile locks. This counter's value should follow in
          proportion to "Batch Requests/sec" and "SQL Compilations/sec".
        tags:
        - tag: scope
          value: performance
        status: DISABLED
