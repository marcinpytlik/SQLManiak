          or avg(/SQLManiak MSSQL by Zabbix agent 2/mssql.average_wait_time,5m)>{$MSSQL.AVGWAIT.CRIT})
        name: 'MSSQL: Blocking has measurable workload impact'
        priority: HIGH
        description: P2 blocking with lock timeouts or high average wait time.
        tags:
        - tag: component
          value: locks
        - tag: symptom
          value: blocking
        - tag: impact
          value: workload
        - tag: priority
          value: P2
      - uuid: 79c953e16e484843b2fb3cc6012a81e8
